<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大肥鱼工作台</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
<style>
/* ============ 主题变量 ============ */
:root{
  --bg:#eef1f7;
  --panel-alpha:0.75; --panel-solid-alpha:1;
  --panel:rgba(255,255,255,var(--panel-alpha));
  --panel-solid:rgba(255,255,255,var(--panel-solid-alpha));
  --text:#1f2937; --muted:#6b7280; --border:#e3e8f0;
  --accent:#4f7cff; --accent-soft:rgba(79,124,255,.12);
  --danger:#ef4444; --danger-soft:rgba(239,68,68,.12); --ok:#10b981;
  --shadow:0 6px 24px rgba(17,24,39,.10); --radius:12px;
}
html[data-theme="dark"]{
  --bg:#0d1220;
  --panel:rgba(22,29,45,var(--panel-alpha));
  --panel-solid:rgba(22,29,45,var(--panel-solid-alpha));
  --text:#e6ebf5; --muted:#94a1b8; --border:#26304a;
  --accent:#5f8bff; --accent-soft:rgba(95,139,255,.16);
  --danger:#f26b6b; --danger-soft:rgba(242,107,107,.14);
  --shadow:0 6px 24px rgba(0,0,0,.4);
}
/* ============ 基础 ============ */
*{box-sizing:border-box;}
html,body{height:100%;margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  font-size:14px;color:var(--text);background:var(--bg);overflow:hidden;
  -webkit-font-smoothing:antialiased;transition:background 0.3s, color 0.3s;
  display: flex; flex-direction: column;
}
#bgLayer{
  position:fixed;inset:-24px;z-index:0;display:none;
  background-size:cover;background-position:center;background-repeat:no-repeat;
  transition:opacity .3s,filter .3s;
}
#app{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;min-height:0;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:rgba(140,150,170,.4);border-radius:6px;}
::-webkit-scrollbar-thumb:hover{background:rgba(140,150,170,.65);}
::-webkit-scrollbar-track{background:transparent;}

/* ============ 权限恢复横幅 ============ */
#permissionBanner {
  display: none; background: #fef3c7; color: #92400e; padding: 10px 16px; font-size: 13px;
  border-bottom: 1px solid #fcd34d; align-items: center; justify-content: space-between; z-index: 100; position: relative;
}
html[data-theme="dark"] #permissionBanner { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border-bottom-color: rgba(245, 158, 11, 0.3); }
#permissionBanner button { background: #d97706; color: white; border: none; padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
#permissionBanner button:hover { background: #b45309; }

/* ============ 头部 ============ */
.app-header{
  display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 16px;
  background:var(--panel);border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);flex-shrink:0;
}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap;}
.logo{font-size:20px;line-height:1;}
.brand-name{font-size:15px;font-weight:600;letter-spacing:.3px;}
.header-actions{display:flex;gap:8px;align-items:center;}

/* ============ 标签栏与操作 ============ */
.tabs-container{
  display:flex;justify-content:space-between;align-items:center;padding:8px 16px;
  background:var(--panel);border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);flex-shrink:0;
}
.tabs-left{display:flex;gap:8px;flex:1;min-width:0;align-items:center;}
.tabs-right{display:flex;gap:8px;flex-shrink:0;margin-left:16px;align-items:center;}

.tab{
  padding:0 14px; height:34px; border-radius:9px; border:1px solid transparent; background:transparent;
  color:var(--muted);cursor:pointer;font-size:13px;white-space:nowrap;font-family:inherit;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.15s;flex-shrink:0;
}
.tab:hover{background:var(--accent-soft);color:var(--text);}
.tab.active{background:var(--accent);color:#fff;}
.tab-count{font-size:11px;padding:0 6px;border-radius:8px;background:rgba(125,125,125,.22);}
.tab.active .tab-count{background:rgba(255,255,255,.28);}
.tab-add{border:1px dashed var(--border);color:var(--muted);}
.tab-repo { border: 1px solid var(--border); background: var(--panel-solid); font-weight: 600; font-size: 14px; }
.tab-repo.active { border-color: var(--accent); }

/* 表名切换组：表名按钮 + ▾ 分离列 */
#tableSwitcher{
  display:inline-flex;align-items:center;gap:6px;flex-shrink:0;height:34px;
}
#btnCurrentTable{
  border:1px solid var(--border);background:var(--panel-solid);border-radius:9px;
  padding:0 14px;font-size:14px;font-weight:600;height:100%;
  color:var(--text);font-family:inherit;display:flex;align-items:center;white-space:nowrap;
  max-width:240px;overflow:hidden;text-overflow:ellipsis;cursor:default;
}
#btnTableDropdown{
  border:1px solid var(--border);background:var(--panel-solid);border-radius:9px;
  padding:0 12px;font-size:12px;height:100%;cursor:pointer;color:var(--muted);font-family:inherit;
  display:flex;align-items:center;justify-content:center;transition:.15s;
}
#btnTableDropdown:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}

/* 表切换弹层 */
.table-search-popover {
  position: absolute; top: 50px; left: 16px; z-index: 1000;
  width: 250px; background: var(--panel-solid); border: 1px solid var(--border);
  border-radius: 12px; box-shadow: var(--shadow); display: none; flex-direction: column; overflow: hidden;
}
.table-search-popover.show { display: flex; }
.tsp-search-wrap { padding: 8px; border-bottom: 1px solid var(--border); }
.tsp-search-wrap input { width: 100%; padding: 6px 10px; border-radius: 6px; font-size: 13px; border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none; transition: 0.2s; }
.tsp-search-wrap input:focus { border-color: var(--accent); }
.tsp-list { max-height: 300px; overflow-y: auto; }
.tsp-item { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 13px; display: flex; justify-content: space-between; align-items:center; }
.tsp-item:last-child { border-bottom: none; }
.tsp-item:hover { background: var(--accent-soft); }
.tsp-item.active { color: var(--accent); font-weight: bold; background: var(--accent-soft); }
.tsp-empty { padding: 14px; text-align: center; color: var(--muted); font-size: 12px; }

/* ============ 主体 (毛玻璃区域) ============ */
.main{flex:1;display:flex;min-height:0;}
.sidebar{
  width:210px;flex-shrink:0;padding:12px;overflow-y:auto;
  background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;gap:8px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.side-title{font-size:12px;color:var(--muted);font-weight:600;padding:0 4px;}
.cat-list{display:flex;flex-direction:column;gap:2px;}
.cat-item{
  display:flex;justify-content:space-between;align-items:center;gap:6px;
  padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:13px;transition:.12s;
}
.cat-item:hover{background:var(--accent-soft);color:var(--text);}
.cat-item.active{background:var(--accent);color:#fff;}
.cat-item.active .cat-num{color:rgba(255,255,255,.9);}
.cat-num{font-size:11px;opacity:.85;}
.side-foot{font-size:11px;color:var(--muted);text-align:center;padding:6px 0 0;}
.content{flex:1;display:flex;flex-direction:column;min-width:0;padding:12px 16px;gap:10px;}

/* ============ 工具栏 ============ */
.toolbar{display:flex;flex-direction:column;gap:8px;flex-shrink:0;position:relative;}
.tb-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;}
.tb-group{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

/* 筛选条件胶囊 */
.filter-tag {
  display: flex;align-items: center;gap: 6px;
  background: var(--accent-soft);border: 1px solid var(--accent);
  padding: 4px 10px;border-radius: 20px;font-size: 12px;
}
.filter-tag span { color: var(--accent);font-weight: bold; }
.filter-tag button { background: none;border: none;color: var(--accent);cursor: pointer;font-weight: bold;padding: 0; }

/* ============ 控件 ============ */
.input{
  padding:7px 10px;border-radius:9px;border:1px solid var(--border);
  background:var(--panel-solid);color:var(--text);font-size:13px;font-family:inherit;
  outline:none;transition:.15s;min-width:0;
}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.search{width:220px;}
select.input{cursor:pointer;}
textarea.input{resize:vertical;min-height:70px;line-height:1.5;}

.btn{
  padding:7px 13px;border-radius:9px;border:1px solid var(--border);
  background:var(--panel-solid);color:var(--text);cursor:pointer;font-size:13px;
  font-family:inherit;transition:.15s;white-space:nowrap;
}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
.btn:disabled{cursor:not-allowed;opacity:0.5;}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover:not(:disabled){filter:brightness(1.08);color:#fff;}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff;}
.btn-danger:hover:not(:disabled){filter:brightness(1.08);color:#fff;}
.btn-ghost{background:transparent;}
.btn-block{width:100%;}
.icon-btn{
  width:34px;height:34px;border-radius:9px;border:1px solid var(--border);
  background:var(--panel-solid);cursor:pointer;font-size:15px;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;color:var(--text);transition:.15s;
}
.icon-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
.icon-btn:disabled{opacity:0.3;cursor:not-allowed;}
.mini-btn{
  padding:4px 9px;border-radius:7px;border:1px solid var(--border);background:transparent;
  color:var(--muted);cursor:pointer;font-size:12px;font-family:inherit;margin-left:4px;transition:.15s;
}
.mini-btn:hover{border-color:var(--accent);color:var(--accent);}
.mini-btn.danger:hover{border-color:var(--danger);color:var(--danger);}

/* ============ 筛选浮层 ============ */
.filter-popover {
  position: absolute; top: 40px; left: 260px; z-index: 1000;
  width: 280px; background: var(--panel-solid); border: 1px solid var(--border);
  border-radius: 8px; box-shadow: var(--shadow); display: none; flex-direction: column;
  font-size: 12px; overflow: hidden;
}
.filter-popover.show { display: flex; }
.fp-header { padding: 10px; border-bottom: 1px solid var(--border); }
.fp-search { width: 100%; padding: 6px 8px; font-size: 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none; }
.fp-search:focus { border-color: var(--accent); }
.fp-actions { padding: 8px 10px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; color: var(--muted); }
.fp-actions a { color: var(--accent); text-decoration: none; margin-left: 8px; cursor: pointer; }
.fp-actions a:hover { text-decoration: underline; }
.fp-list { max-height: 250px; overflow-y: auto; }
.fp-item { border-bottom: 1px solid var(--border); }
.fp-item:last-child { border-bottom: none; }
.fp-field-row { display: flex; align-items: center; padding: 8px 10px; cursor: pointer; transition: .1s; }
.fp-field-row:hover { background: var(--bg); }
.fp-field-row input[type="checkbox"] { margin-right: 8px; accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; }
.fp-field-row label { cursor: pointer; flex: 1; user-select: none; }
.fp-values { padding: 6px 10px 10px 30px; background: var(--bg); display: none; }
.fp-item.expanded .fp-values { display: block; }
.fp-val-item { display: flex; align-items: center; margin-bottom: 4px; }
.fp-val-item input[type="checkbox"] { margin-right: 6px; accent-color: var(--accent); cursor: pointer; }
.fp-val-input { width: 100%; padding: 4px 8px; font-size: 12px; border-radius: 4px; border: 1px solid var(--border); background: var(--panel-solid); color: var(--text); outline: none; }

/* ============ 表格与分页 ============ */
.table-wrap{
  flex:1;overflow:auto;border-radius:var(--radius);border:1px solid var(--border);
  background:var(--panel);min-height:0;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;flex-direction:column;
}
.data-table{width:100%;border-collapse:collapse;font-size:13px;}
.data-table thead th{
  position:sticky;top:0;z-index:2;text-align:left;padding:10px 12px;
  background:var(--panel-solid);border-bottom:1px solid var(--border);
  font-weight:600;color:var(--muted);font-size:12px;white-space:nowrap;
}
.data-table td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top;}
.data-table tbody tr:hover{background:var(--accent-soft);}
.data-table tbody tr.selected{background:rgba(79,124,255,.08);}

/* 长文本：自动换行 + 可拖拽高度 */
.cell-name, .cell-note, .cell-text {
  min-width: 120px;
  min-height: 24px;
  max-height: 400px;
  overflow-y: auto;
  resize: vertical;
  word-break: break-word;
  white-space: normal;
  line-height: 1.5;
  display: block;
  padding: 4px 6px;
  border: 1px dashed transparent;
  transition: border-color .2s;
}
.cell-name:hover, .cell-note:hover, .cell-text:hover {
  border-color: var(--border);
}
.cell-name { font-weight: 600; }
.cell-note { color: var(--muted); }

.cell-date{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;}
.op-col{width:1%;white-space:nowrap;text-align:right;}
.cb-col{width:1%;padding-right:0;}
.cb-col input{accent-color:var(--accent);cursor:pointer;}

.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;}
.tag-muted{background:rgba(125,125,125,.14);color:var(--muted);}
.p-high{background:var(--danger-soft);color:var(--danger);}
.p-mid{background:rgba(245,158,11,.16);color:#d97706;}
.p-low{background:rgba(16,185,129,.14);color:var(--ok);}

.pagination{
  display:flex;align-items:center;justify-content:flex-end;gap:12px;
  padding:10px 16px;border-top:1px solid var(--border);
  background:var(--panel);font-size:13px;color:var(--muted);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-radius: 0 0 var(--radius) var(--radius);
}
.pagination input { width: 60px; padding: 4px; text-align: center; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none; }
.pagination button { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; }
.pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
.pagination button:not(:disabled):hover { border-color: var(--accent); color: var(--accent); }

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:240px;gap:12px;color:var(--muted);}
.empty p{margin:0;font-size:13px;}

/* ============ 附件仓库网格 ============ */
.attachment-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; padding: 16px; }
.attachment-card { background: var(--panel-solid); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer; transition: .2s; text-align: center; position: relative; }
.attachment-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--accent); }
.attachment-card.selected { border-color: var(--accent); background: var(--accent-soft); }
.att-checkbox { position: absolute; top: 10px; left: 10px; accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; z-index: 2; }
.attachment-icon { font-size: 36px; line-height: 1; margin-top: 8px; }
.attachment-name { font-size: 13px; font-weight: 500; word-break: break-all; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.attachment-meta { font-size: 11px; color: var(--muted); }
.att-tags { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-top: 4px; }
.att-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(125,125,125,.1); color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att-actions { display: flex; gap: 8px; width: 100%; margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; justify-content: center; }
.att-actions button { flex: 1; padding: 4px 0; font-size: 12px; }

/* ============ 弹窗 ============ */
.modal-mask{position:fixed;inset:0;z-index:1000;background:rgba(10,15,25,.45);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .15s ease;}
.modal{width:100%;background:var(--panel-solid);border-radius:16px;box-shadow:var(--shadow);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border);animation:popIn .18s ease;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--border);flex-shrink:0;}
.modal-head h3{margin:0;font-size:15px;font-weight:600;}
.modal-body{padding:18px;overflow-y:auto;flex:1;}
.modal-foot{padding:12px 18px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--border);flex-shrink:0;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}

.form{display:flex;flex-direction:column;gap:14px;}
.form-row{display:flex;flex-direction:column;gap:6px;}
.form-row>label{font-size:13px;color:var(--muted);font-weight:500;}
.req{color:var(--danger);}
.dialog-msg{font-size:14px;line-height:1.65;color:var(--text);word-break:break-word;}
.dialog-msg b{color:var(--accent);}

.field-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.check-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:9px;cursor:pointer;font-size:13px;transition:.12s;}
.check-item:hover{border-color:var(--accent);}
.check-item.disabled{opacity:.6;cursor:not-allowed;}
.check-item input{accent-color:var(--accent);cursor:pointer;}
.check-item em{font-style:normal;font-size:11px;color:var(--muted);}

/* ============ 设置中心 ============ */
.settings-layout { display: flex; gap: 20px; min-height: 360px; }
.settings-nav { width: 120px; display: flex; flex-direction: column; gap: 4px; border-right: 1px solid var(--border); padding-right: 12px; }
.settings-nav-item { padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--muted); transition: .15s; }
.settings-nav-item:hover { background: var(--accent-soft); color: var(--text); }
.settings-nav-item.active { background: var(--accent); color: #fff; }
.settings-content { flex: 1; display: flex; flex-direction: column; gap: 16px; }

/* ============ 字段编辑器 ============ */
.field-editor{display:flex;flex-direction:column;gap:8px;}
.field-row{display:flex;gap:6px;align-items:center;padding:8px;border:1px solid var(--border);border-radius:10px;background:rgba(125,125,125,.035);flex-wrap:wrap;}
.field-row .mini-btn{margin-left:0;}
.field-name-tag{font-size:11px;color:var(--muted);border:1px dashed var(--border);padding:3px 8px;border-radius:7px;white-space:nowrap;}

.seg{display:flex;gap:6px;flex-wrap:wrap;}
.seg-btn{padding:7px 14px;border-radius:9px;border:1px solid var(--border);background:var(--panel-solid);color:var(--muted);cursor:pointer;font-size:13px;font-family:inherit;transition:.15s;}
.seg-btn:hover{border-color:var(--accent);}
.seg-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}

.cat-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;}
.cat-row-name{flex:1;font-weight:500;}
.cat-row-usage{font-size:12px;color:var(--muted);}
.cat-add-row{display:flex;gap:8px;margin-top:12px;}
.cat-add-row .input{flex:1;}

input[type="range"]{width:100%;accent-color:var(--accent);cursor:pointer;}

/* ============ 图片/文件字段 ============ */
.img-field, .file-field{display:flex;flex-direction:column;gap:8px;}
.img-preview{width:100%;min-height:64px;border:1px dashed var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;padding:8px;background:rgba(125,125,125,.04);}
.img-preview img{max-width:100%;max-height:200px;border-radius:8px;display:block;}
.img-empty{font-size:12px;color:var(--muted);}
.img-actions{display:flex;gap:8px;}
.thumb{width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--border);cursor:zoom-in;display:block;}
.cell-img{padding:6px 12px;}
.file-link { color: var(--accent); text-decoration: none; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.file-link:hover { text-decoration: underline; }

/* ============ Toast ============ */

<script>
/* ===================================================================
   大肥鱼工作台 —— 终极版 (IndexedDB超大容量持久化)
   =================================================================== */

/* ---------------- 字段类型 ---------------- */
const FIELD_TYPES = [
  { value:'text', label:'单行文本' }, { value:'textarea', label:'多行文本' },
  { value:'number', label:'数字' }, { value:'select', label:'下拉选项' },
  { value:'date', label:'日期' }, { value:'datetime-local', label:'日期时间' },
  { value:'category', label:'分类' }, { value:'image', label:'图片' },
  { value:'file', label:'文件/附件' }
];
const TYPE_MAP = Object.fromEntries(FIELD_TYPES.map(t => [t.value, t]));

const LEGACY_FIELDS = {
  name: { label:'名称', type:'text', required:true },
  note: { label:'备注', type:'textarea' },
  category: { label:'分类', type:'category' },
  priority: { label:'优先级', type:'select', options:['高','中','低'] },
  planDate: { label:'计划日期', type:'date' },
  deadline: { label:'截止时间', type:'datetime-local' },
  bizDate: { label:'业务日期', type:'date' },
  image: { label:'图片', type:'image' }
};
const PRESET_FIELDS = [
  { label:'备注', type:'textarea' }, { label:'分类', type:'category' },
  { label:'优先级', type:'select', options:['高','中','低'] },
  { label:'计划日期', type:'date' }, { label:'截止时间', type:'datetime-local' },
  { label:'图片', type:'image' }, { label:'文件/附件', type:'file' }
];

const STORAGE_KEY = 'dfy_admin_tool_v1';
const UI_STATE_KEY = 'dfy_ui_state_v1';

/* ---------------- 状态与撤销栈 ---------------- */
let S = null;
let undoStack = [];
let redoStack = [];
const MAX_UNDO = 50;

let ui = { 
  currentView: 'table',
  tableId:null, selectedIds:new Set(), page: 1, pageSize: 20,
  attSearch: '', attCategory: 'all', attFiles: [], attLoading: false,
  attSelectedFiles: new Set()
};
let uiState = {
  search: {},
  categoryId: {},
  filters: {}
};
let pendingImportTable = null;
let backupDirHandle = null;
let autoBackupInterval = null;

let attachmentDirHandle = null;
let isPermLost = false;

let savedBackupDirName = '';
let savedAttachmentDirName = '';

let currentTspOutsideClick = null;

/* ---------------- 小工具 ---------------- */
const $ = sel => document.querySelector(sel);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m]));
const fmtDateTime = v => v ? String(v).replace('T', ' ') : '';
const formatSize = bytes => {
  if (bytes === 0) return '0 B';
  const k = 1024, sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
};

function loadUiState() {
  try {
    const raw = localStorage.getItem(UI_STATE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      uiState = Object.assign({ search: {}, categoryId: {}, filters: {} }, parsed);
    }
  } catch (e) {}
}
function saveUiState() {
  localStorage.setItem(UI_STATE_KEY, JSON.stringify(uiState));
}

/* ---------------- 撤回栈 ---------------- */
function pushUndo() {
  undoStack.push(JSON.stringify(S));
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  redoStack = [];
  updateUndoRedoBtns();
}
function undo() {
  if (undoStack.length === 0) return;
  redoStack.push(JSON.stringify(S));
  S = JSON.parse(undoStack.pop());
  save();
  renderView();
  updateUndoRedoBtns();
  toast('已撤回');
}
function redo() {
  if (redoStack.length === 0) return;
  undoStack.push(JSON.stringify(S));
  S = JSON.parse(redoStack.pop());
  save();
  renderView();
  updateUndoRedoBtns();
  toast('已反撤回');
}
function updateUndoRedoBtns() {
  const uBtn = document.getElementById('undoBtn');
  const rBtn = document.getElementById('redoBtn');
  if (uBtn) uBtn.disabled = undoStack.length === 0;
  if (rBtn) rBtn.disabled = redoStack.length === 0;
}

/* ---------------- 数据库存储引擎 (IndexedDB) ---------------- */
function openDataDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('DFY_DataDB', 1);
    req.onupgradeneeded = e => { 
      const db = e.target.result;
      if (!db.objectStoreNames.contains('appState')) db.createObjectStore('appState');
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
}

async function saveToDB(data) {
  try {
    const db = await openDataDB();
    const tx = db.transaction('appState', 'readwrite');
    tx.objectStore('appState').put(data, 'current');
    return new Promise(res => tx.oncomplete = res);
  } catch(e) { console.error('保存到数据库失败', e); }
}

async function loadFromDB() {
  try {
    const db = await openDataDB();
    const tx = db.transaction('appState', 'readonly');
    const req = tx.objectStore('appState').get('current');
    return new Promise(res => req.onsuccess = () => res(req.result));
  } catch(e) { return null; }
}

/* ---------------- 目录句柄 (IndexedDB) ---------------- */
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('DFY_BackupDB', 2);
    req.onupgradeneeded = e => { 
      const db = e.target.result;
      if (!db.objectStoreNames.contains('handles')) db.createObjectStore('handles');
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
}
async function saveDirHandle(type, handle) {
  const db = await openDB();
  const tx = db.transaction('handles', 'readwrite');
  tx.objectStore('handles').put(handle, type);
  
  if (type === 'backup') savedBackupDirName = handle.name;
  if (type === 'attachment') savedAttachmentDirName = handle.name;
  localStorage.setItem('dfy_dir_names', JSON.stringify({ backup: savedBackupDirName, attachment: savedAttachmentDirName }));
  
  return new Promise(res => tx.oncomplete = res);
}
async function getDirHandle(type) {
  const db = await openDB();
  const tx = db.transaction('handles', 'readonly');
  const req = tx.objectStore('handles').get(type);
  return new Promise(res => req.onsuccess = () => res(req.result));
}

/* ---------------- 持久化 ---------------- */
function save(){
  saveToDB(S);
  return true;
}

function defaultFields(){
  return [
    { id:'f_name', label:'名称', type:'text', required:true },
    { id:'f_note', label:'备注', type:'textarea' },
    { id:'f_cat', label:'分类', type:'category' },
    { id:'f_prio', label:'优先级', type:'select', options:['高','中','低'] },
    { id:'f_plan', label:'计划日期', type:'date' },
    { id:'f_ddl', label:'截止时间', type:'datetime-local' }
  ];
}
function defaultCategories(){
  return [{ id: uid(), name: '工作' }, { id: uid(), name: '生活' }, { id: uid(), name: '学习' }];
}
function defaultState(){
  return {
    version: 33,
    tables: [
      { id:'sys_todo', name:'待办', system:true, fields: defaultFields(), categories: defaultCategories(), records:[], customBg: '' },
      { id:'sys_done', name:'已完成', system:true, fields: defaultFields(), categories: defaultCategories(), records:[], customBg: '' },
      { id:'sys_archive', name:'存档', system:true, fields: defaultFields(), categories: defaultCategories(), records:[], customBg: '' }
    ],
    attCategories: [{ id: uid(), name: '流程文档' }, { id: uid(), name: '操作手册' }],
    attTags: {}, 
    settings: { 
      theme:'light', bgType:'none', bgUrl:'', bgImage:'', bgOpacity:0.22, bgBlur:0,
      autoBackupMin: 0, accentColor: '#4f7cff', fontFamily: '',
      panelAlpha: 0.75, panelSolidAlpha: 1,
      relationGroups: [
        { id: 'rel_default', name: '默认流转', tableIds: ['sys_todo', 'sys_done', 'sys_archive'] }
      ]
    }
  };
}
function normalizeField(f){
  if (typeof f === 'string') { const leg = LEGACY_FIELDS[f] || { label: f, type: 'text' }; return Object.assign({ id: f }, leg); }
  const t = TYPE_MAP[f.type] ? f.type : 'text';
  const o = { id: f.id || ('f_'+uid()), label: (f.label || '未命名字段').trim() || '未命名字段', type: t };
  if (t === 'select') o.options = (Array.isArray(f.options) && f.options.length) ? f.options.map(String) : ['选项1','选项2'];
  if (f.required) o.required = true;
  return o;
}
function normalizeTable(t, globalCats){
  if (!t.id) t.id = 'tbl_' + uid();
  if (!t.name) t.name = '未命名表';
  if (!Array.isArray(t.records)) t.records = [];
  
  if (!Array.isArray(t.categories)) {
    t.categories = globalCats ? globalCats.map(c => ({ id: c.id, name: c.name })) : defaultCategories();
  }

  let fs = Array.isArray(t.fields) ? t.fields.map(normalizeField) : [];
  const seen = new Set();
  fs.forEach(f => { if (seen.has(f.id)) f.id = 'f_' + uid(); seen.add(f.id); });
  if (!fs.length) fs = defaultFields();
  let req = fs.find(f => f.required);
  if (!req) { const ft = fs.find(f => f.type === 'text' || f.type === 'textarea'); if (ft) ft.required = true; else fs.unshift({ id: 'f_'+uid(), label: '名称', type: 'text', required: true }); }
  let found = false;
  fs.forEach(f => { if (f.required) { if (found) delete f.required; else { found = true; f.type = 'text'; delete f.options; } } });
  t.fields = fs;
  t.records.forEach(r => { if (!r.id) r.id = uid(); });
}
function normalizeState(s){
  const d = defaultState();
  if (!s || typeof s !== 'object') s = d;
  s.version = 33;
  if (!Array.isArray(s.tables) || !s.tables.length) s.tables = d.tables;
  
  const globalCats = s.categories || d.categories || defaultCategories();
  delete s.categories; 

  s.settings = Object.assign({}, d.settings, s.settings || {});
  if (typeof s.settings.panelAlpha !== 'number') s.settings.panelAlpha = 0.75;
  if (typeof s.settings.panelSolidAlpha !== 'number') s.settings.panelSolidAlpha = 1;
  if (!Array.isArray(s.settings.relationGroups)) s.settings.relationGroups = d.settings.relationGroups;
  if (!Array.isArray(s.attCategories)) s.attCategories = d.attCategories || [];
  if (!s.attTags) s.attTags = {};
  
  s.tables.forEach(t => normalizeTable(t, globalCats));
  
  const seen = new Set();
  s.tables.forEach(t => { if (seen.has(t.id)) t.id = 'tbl_' + uid(); seen.add(t.id); });
  return s;
}

async function loadState(){
  try {
    // 1. 优先尝试从 IndexedDB 读取（容量极大，不会爆5MB）
    const dbData = await loadFromDB();
    if (dbData) {
      return normalizeState(dbData);
    }

    // 2. 如果数据库没数据，尝试从老版本的 localStorage 读取
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      const normalized = normalizeState(parsed);
      // 迁移到 IndexedDB 后，清空 localStorage 释放空间
      await saveToDB(normalized);
      localStorage.removeItem(STORAGE_KEY);
      return normalized;
    }
  }
  catch (e) { console.warn('读取本地数据失败', e); }
  
  return defaultState();
}

/* ---------------- 通用弹窗 ---------------- */
function openModal(opts){
  const root = document.getElementById('modalRoot');
  const mask = document.createElement('div'); mask.className = 'modal-mask';
  mask.innerHTML = `<div class="modal" style="max-width:${opts.width || '560px'}"><div class="modal-head"><h3>${esc(opts.title || '')}</h3><button class="icon-btn" data-modal-close>✕</button></div><div class="modal-body"></div>${opts.footer !== undefined ? `<div class="modal-foot">${opts.footer}</div>` : ''}</div>`;
  const bodyEl = mask.querySelector('.modal-body');
  if (typeof opts.body === 'string') bodyEl.innerHTML = opts.body; else if (opts.body) bodyEl.appendChild(opts.body);
  root.appendChild(mask);
  let closed = false;
  const close = () => { if (closed) return; closed = true; mask.remove(); if (opts.onClose) opts.onClose(); };
  mask.querySelector('[data-modal-close]').onclick = close;
  if (opts.onMount) opts.onMount(mask, close);
  return { el: mask, close };
}
function confirmDialog(opts){
  return new Promise(resolve => {
    const { title = '请确认', message = '', okText = '确定', cancelText = '取消', danger = false, requireText = null } = opts || {};
    let resolved = false; let closeRef = null;
    const finish = v => { if (resolved) return; resolved = true; if (closeRef) closeRef(); resolve(v); };
    const bodyHTML = `<div class="dialog-msg">${message}</div>` + (requireText ? `<div class="form-row" style="margin-top:14px"><label>请输入 <b style="color:var(--danger)">${esc(requireText)}</b> 以确认</label><input class="input" id="confirmTextInput" autocomplete="off"></div>` : '');
    const modal = openModal({
      title, body: bodyHTML, width: '430px',
      footer: `<button class="btn" data-cancel>${esc(cancelText)}</button><button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-ok>${esc(okText)}</button>`,
      onMount(el){
        el.querySelector('[data-cancel]').onclick = () => finish(false);
        const okBtn = el.querySelector('[data-ok]'); const inp = el.querySelector('#confirmTextInput');
        if (inp) { okBtn.disabled = true; okBtn.style.opacity = .5; inp.addEventListener('input', () => { const ok = inp.value.trim() === requireText; okBtn.disabled = !ok; okBtn.style.opacity = ok ? 1 : .5; }); setTimeout(() => inp.focus(), 60); }
        okBtn.onclick = () => { if (!okBtn.disabled) finish(true); };
      },
      onClose(){ if (!resolved) { resolved = true; resolve(false); } }
    });
    closeRef = modal.close;
  });
}
function toast(msg, type){
  const root = document.getElementById('toastRoot'); const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : ''); el.textContent = msg; root.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, 2200);
}

/* ===================================================================
   设置中心
   =================================================================== */

  const body = document.createElement('div');

      <div class="settings-nav">

      </div>
      <div class="settings-content" id="settingsContent"></div>

          </div>

          </div>
        </div>
        <div class="form-row">
          <label>系统字体</label>
          <select class="input" id="fontSelect">
            <option value="" ${!s.fontFamily ? 'selected' : ''}>系统默认</option>
            <option value="'Microsoft YaHei', sans-serif" ${s.fontFamily === "'Microsoft YaHei', sans-serif" ? 'selected' : ''}>微软雅黑</option>
            <option value="'PingFang SC', sans-serif" ${s.fontFamily === "'PingFang SC', sans-serif" ? 'selected' : ''}>苹方</option>
            <option value="'SimSun', serif" ${s.fontFamily === "'SimSun', serif" ? 'selected' : ''}>宋体</option>
            <option value="'KaiTi', serif" ${s.fontFamily === "'KaiTi', serif" ? 'selected' : ''}>楷体</option>
            <option value="'SimHei', sans-serif" ${s.fontFamily === "'SimHei', sans-serif" ? 'selected' : ''}>黑体</option>
            <option value="'FangSong', serif" ${s.fontFamily === "'FangSong', serif" ? 'selected' : ''}>仿宋</option>
            <option value="'Comic Sans MS', cursive" ${s.fontFamily === "'Comic Sans MS', cursive" ? 'selected' : ''}>Comic Sans</option>
            <option value="Arial, sans-serif" ${s.fontFamily === "Arial, sans-serif" ? 'selected' : ''}>Arial</option>
            <option value="'Segoe UI', sans-serif" ${s.fontFamily === "'Segoe UI', sans-serif" ? 'selected' : ''}>Segoe UI</option>
            <option value="'Times New Roman', serif" ${s.fontFamily === "'Times New Roman', serif" ? 'selected' : ''}>Times New Roman</option>
            <option value="'Courier New', monospace" ${s.fontFamily === "'Courier New', monospace" ? 'selected' : ''}>Courier New</option>
          </select>
        </div>
      `;
      content.querySelectorAll('[data-theme]').forEach(btn => {
        btn.onclick = () => {
          S.settings.theme = btn.dataset.theme;
          content.querySelectorAll('[data-theme]').forEach(b => b.classList.toggle('active', b === btn));
          save(); applyTheme();

        save(); applyTheme();
      };
      content.querySelector('#fontSelect').onchange = (e) => {
        S.settings.fontFamily = e.target.value;
        save(); applyTheme();

    } else if (tab === 'appearance') {
      const pa = (typeof s.panelAlpha === 'number') ? s.panelAlpha : 0.75;
      const psa = (typeof s.panelSolidAlpha === 'number') ? s.panelSolidAlpha : 1;
      let perTableId = ui.tableId || (S.tables[0] && S.tables[0].id) || '';

      content.innerHTML = `
        <div class="form-row">
          <label>全局背景壁纸</label>
          <div class="seg">
            <button class="seg-btn ${s.bgType === 'none' ? 'active' : ''}" data-bg="none">无背景</button>
            <button class="seg-btn ${s.bgType === 'url' ? 'active' : ''}" data-bg="url">在线壁纸</button>
            <button class="seg-btn ${s.bgType === 'local' ? 'active' : ''}" data-bg="local">本地图片</button>

/* ===================================================================
   自动备份 & 权限初始化
   =================================================================== */
async function performAutoBackup() {
  if (!backupDirHandle || S.settings.autoBackupMin === 0) return;
  try {
    const perm = await backupDirHandle.queryPermission({ mode: 'readwrite' });
    if (perm !== 'granted') return; 
    if (typeof XLSX === 'undefined') return;

    for (const t of S.tables) {
      const wb = buildTableExcel(t, false);
      const buffer = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
      const fileName = t.name.replace(/[\\\/\?\*\[\]\:]/g, '_') + '.xlsx';
      
      const fileHandle = await backupDirHandle.getFileHandle(fileName, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(buffer);
      await writable.close();
    }
  } catch (err) { console.error('自动备份失败:', err); }
}

function startAutoBackup() {
  if (autoBackupInterval) clearInterval(autoBackupInterval);
  const min = S.settings.autoBackupMin;
  if (min > 0 && backupDirHandle) autoBackupInterval = setInterval(performAutoBackup, min * 60 * 1000);
}

async function checkPermissionStatus() {
  let lost = false;
  const banner = document.getElementById('permissionBanner');
  
  try {
    const namesStr = localStorage.getItem('dfy_dir_names');
    if (namesStr) {
      const names = JSON.parse(namesStr);
      savedBackupDirName = names.backup || '';
      savedAttachmentDirName = names.attachment || '';
    }

    const bHandle = await getDirHandle('backup');
    if (bHandle) {
      backupDirHandle = bHandle;
      savedBackupDirName = bHandle.name;
      try {
        const perm = await bHandle.queryPermission({ mode: 'readwrite' });
        if (perm === 'granted') startAutoBackup(); else lost = true;
      } catch (e) { lost = true; }
    }
    
    const aHandle = await getDirHandle('attachment');
    if (aHandle) {
      attachmentDirHandle = aHandle;
      savedAttachmentDirName = aHandle.name;
      try {
        const perm = await aHandle.queryPermission({ mode: 'readwrite' });
        if (perm !== 'granted') lost = true;
      } catch (e) { lost = true; }
    }
  } catch (e) { console.warn('初始化目录句柄失败', e); }
  
  isPermLost = lost;
  if (lost) banner.style.display = 'flex';
  else banner.style.display = 'none';
}

async function restorePermissions() {
  let restoredCount = 0;
  try {
    if (backupDirHandle && (await backupDirHandle.queryPermission({ mode: 'readwrite' })) !== 'granted') {
      const req = await backupDirHandle.requestPermission({ mode: 'readwrite' });
      if (req === 'granted') restoredCount++;
    }
    if (attachmentDirHandle && (await attachmentDirHandle.queryPermission({ mode: 'readwrite' })) !== 'granted') {
      const req = await attachmentDirHandle.requestPermission({ mode: 'readwrite' });
      if (req === 'granted') restoredCount++;
    }
    
    if (restoredCount > 0) {
      toast('权限恢复成功');
      document.getElementById('permissionBanner').style.display = 'none';
      isPermLost = false;
      if (ui.currentView === 'attachments') loadAttachments();
      startAutoBackup();
    } else {
      toast('未恢复权限，可能是被浏览器拦截，请重新在设置中选择文件夹', 'error');
    }
  } catch (e) {
    console.error('恢复权限失败', e);
    toast('恢复权限失败，请重新在设置中选择文件夹', 'error');
  }
}

/* ===================================================================
   业务逻辑
   =================================================================== */
function currentTable(){ return S.tables.find(t => t.id === ui.tableId) || S.tables[0] || null; }
function catName(t, id){ if(!t || !t.categories) return ''; const c = t.categories.find(c => c.id === id); return c ? c.name : ''; }
function attCatName(id){ const c = S.attCategories.find(c => c.id === id); return c ? c.name : ''; }
function nameField(t){ return t.fields.find(f => f.required) || t.fields[0]; }
function categoryField(t){ return t.fields.find(f => f.type === 'category'); }
function catUsage(t, cid){ 
  let n = 0; 
  const catField = categoryField(t);
  if (catField) t.records.forEach(r => { if (r[catField.id] === cid) n++; }); 
  return n; 
}

function applyTheme(){ 
  document.documentElement.setAttribute('data-theme', S.settings.theme); 
  document.body.style.fontFamily = S.settings.fontFamily || '-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif';
  
  if (S.settings.accentColor) {
    const hex = S.settings.accentColor;
    const r = parseInt(hex.slice(1, 3), 16) || 79;
    const g = parseInt(hex.slice(3, 5), 16) || 124;
    const b = parseInt(hex.slice(5, 7), 16) || 255;
    document.documentElement.style.setProperty('--accent', hex);
    document.documentElement.style.setProperty('--accent-soft', `rgba(${r},${g},${b},0.12)`);
  }

  const pa = (typeof S.settings.panelAlpha === 'number') ? S.settings.panelAlpha : 0.75;
  const psa = (typeof S.settings.panelSolidAlpha === 'number') ? S.settings.panelSolidAlpha : 1;
  document.documentElement.style.setProperty('--panel-alpha', String(pa));
  document.documentElement.style.setProperty('--panel-solid-alpha', String(psa));
}

function applyBg(){
  const layer = document.getElementById('bgLayer'); 
  const s = S.settings;
  const t = currentTable();
  
  let url = '';
  if (t && t.customBg) {
    url = t.customBg;
  } else {
    if (s.bgType === 'url') url = (s.bgUrl || '').trim();
    else if (s.bgType === 'local') url = s.bgImage || '';
  }

  if (!url) { layer.style.display = 'none'; return; }
  layer.style.display = 'block'; 
  layer.style.backgroundImage = `url("${String(url).replace(/"/g, '%22')}")`;
  layer.style.opacity = String(s.bgOpacity); 
  layer.style.filter = s.bgBlur ? `blur(${s.bgBlur}px)` : 'none';
}

    tableActions.style.display = 'flex';
    renderSidebar();
    renderToolbar();
    renderTable();
  }
}

/* ---------------- 表切换 ---------------- */
function openTableSearch(anchorEl) {
  const popover = document.getElementById('tableSearchPopover');
  const listEl  = document.getElementById('tspList');
  const searchEl = document.getElementById('tspSearchInput');

  const appEl  = document.getElementById('app');
  const appRect = appEl.getBoundingClientRect();
  const rect    = anchorEl.getBoundingClientRect();

  popover.style.top  = (rect.bottom - appRect.top + 8) + 'px';
  let left = rect.left - appRect.left;
  if (left + 250 > appRect.width) left = Math.max(8, appRect.width - 250 - 8);
  popover.style.left = left + 'px';
  popover.classList.add('show');

  const closePopover = () => {
    popover.classList.remove('show');
    if (currentTspOutsideClick) {
      document.removeEventListener('click', currentTspOutsideClick);
      currentTspOutsideClick = null;
    }
  };

  const outsideClick = (e) => {
    if (!popover.contains(e.target) && !anchorEl.contains(e.target)) closePopover();
  };

  const renderList = (kw = '') => {
    const q = String(kw).trim().toLowerCase();
    const filtered = S.tables.filter(t => String(t.name).toLowerCase().includes(q));
    
    if (!filtered.length) {
      listEl.innerHTML = `<div class="tsp-empty">没有找到匹配的表</div>`;
      return;
    }
    listEl.innerHTML = filtered.map(t => `
      <div class="tsp-item ${t.id === ui.tableId ? 'active' : ''}" data-id="${t.id}">
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(t.name)}</span>
        <span style="font-size:11px;opacity:.6;flex-shrink:0;margin-left:8px;">${t.records.length} 条</span>
      </div>
    `).join('');

    listEl.querySelectorAll('.tsp-item').forEach(item => {
      item.onclick = () => {
        switchTable(item.dataset.id);
        closePopover();
      };
    });
  };

  if (searchEl) {
    searchEl.value = '';
    searchEl.oninput = () => renderList(searchEl.value);
    setTimeout(() => searchEl.focus(), 50);
  }
  
  renderList();

  if (currentTspOutsideClick) document.removeEventListener('click', currentTspOutsideClick);
  currentTspOutsideClick = outsideClick;
  setTimeout(() => {
    document.removeEventListener('click', outsideClick);
    document.addEventListener('click', outsideClick);
  }, 10);
}

/* ---------------- 附件仓库视图 ---------------- */
async function loadAttachments() {
  if (!attachmentDirHandle) {
    ui.attFiles = [];
    renderAttachmentsView();
    return;
  }
  
  let perm = await attachmentDirHandle.queryPermission({ mode: 'readwrite' });
  if (perm !== 'granted') {
    perm = await attachmentDirHandle.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') {
      isPermLost = true;
      document.getElementById('permissionBanner').style.display = 'flex';
      renderAttachmentsView();
      return;
    } else {
      isPermLost = false;
      document.getElementById('permissionBanner').style.display = 'none';
    }
  }
  
  ui.attLoading = true;
  renderAttachmentsView();
  
  try {
    const files = [];
    for await (const entry of attachmentDirHandle.values()) {
      if (entry.kind === 'file') {
        const file = await entry.getFile();
        files.push({ name: file.name, size: file.size, type: file.type || entry.name.split('.').pop().toLowerCase(), handle: entry });
      }
    }
    ui.attFiles = files.sort((a, b) => a.name.localeCompare(b.name));
  } catch (err) {
    console.error(err);
    toast('读取附件文件夹失败', 'error');
    ui.attFiles = [];
  }
  
  ui.attLoading = false;
  renderAttachmentsView();
}

  ui.attFiles.forEach(f => {

          <span class="cat-num">${counts[c.id] || 0}</span>
        </div>

    <div class="cat-list">
      <div class="cat-item ${ui.attCategory === 'image' ? 'active' : ''}" data-att-cat="image"><span>🖼️ 图片</span></div>
      <div class="cat-item ${ui.attCategory === 'video' ? 'active' : ''}" data-att-cat="video"><span>🎬 视频</span></div>
      <div class="cat-item ${ui.attCategory === 'doc' ? 'active' : ''}" data-att-cat="doc"><span>📑 文档</span></div>

function renderAttachmentsView() {
  const toolbar = document.getElementById('toolbar');
  const tableWrap = document.getElementById('tableWrap');
  const pagination = document.getElementById('pagination');
  pagination.innerHTML = '';

  if (!attachmentDirHandle) {
    toolbar.innerHTML = '';
    tableWrap.innerHTML = `<div class="empty"><p>尚未设置附件仓库文件夹，请在设置中指定</p><button class="btn btn-primary" id="emptyGoSettings">去设置</button></div>`;
    document.getElementById('emptyGoSettings').onclick = openSettings;
    return;
  }

  if (isPermLost) {
    toolbar.innerHTML = '';
    tableWrap.innerHTML = `<div class="empty"><p style="color:var(--danger)">⚠️ 文件夹访问权限已失效</p><p>浏览器安全限制导致重启后权限丢失。</p><button class="btn btn-primary" id="btnRecoverInEmpty" style="margin-top:10px;">🔓 点击恢复文件夹权限</button></div>`;
    document.getElementById('btnRecoverInEmpty').onclick = restorePermissions;
    return;
  }

  let batchBtnHTML = '';
  if (ui.attSelectedFiles.size > 0) {
    batchBtnHTML = `<button class="btn btn-primary" id="batchTagBtn">给选中项(${ui.attSelectedFiles.size})打标签</button>`;
  }

  toolbar.innerHTML = `
    <div class="tb-row">
      <div class="tb-group">
        <input id="attSearch" class="input search" type="text" placeholder="搜索文件名..." value="${esc(ui.attSearch)}">
        <button class="btn" id="attRefreshBtn">🔄 刷新列表</button>
        <button class="btn btn-primary" id="attImportBtn">＋ 导入文件</button>
      </div>
      <div class="tb-group">
        ${batchBtnHTML}
      </div>
    </div>
  `;

  const searchInput = toolbar.querySelector('#attSearch');
  searchInput.oninput = (e) => { ui.attSearch = e.target.value; updateAttGrid(); };
  toolbar.querySelector('#attRefreshBtn').onclick = loadAttachments;
  toolbar.querySelector('#attImportBtn').onclick = () => {
    const inp = document.getElementById('attImportInput');
    inp.value = '';
    inp.click();
  };
  
  const batchTagBtn = toolbar.querySelector('#batchTagBtn');
  if (batchTagBtn) batchTagBtn.onclick = () => openAttTagDialog();

  if (ui.attLoading) {
    tableWrap.innerHTML = `<div class="empty"><p>正在读取文件夹...</p></div>`;
    return;
  }

  const updateAttGrid = () => {
    let filtered = ui.attFiles;
    
    if (ui.attCategory === 'image' || ui.attCategory === 'video' || ui.attCategory === 'doc' || ui.attCategory === 'other') {
      filtered = filtered.filter(f => getFileCategory(f.name) === ui.attCategory);
    } else if (ui.attCategory !== 'all') {
      filtered = filtered.filter(f => {
        const tags = S.attTags[f.name] || [];
        return tags.includes(ui.attCategory);
      });
    }
    
    if (ui.attSearch) {
      const kw = ui.attSearch.toLowerCase();
      filtered = filtered.filter(f => f.name.toLowerCase().includes(kw));
    }

    if (!filtered.length) {
      tableWrap.innerHTML = `<div class="empty"><p>没有找到匹配的文件</p></div>`;
      return;
    }

    let html = `<div class="attachment-grid">`;
    filtered.forEach(f => {
      const cat = getFileCategory(f.name);
      let icon = '📄';
      if (cat === 'image') icon = '🖼️';
      else if (cat === 'video') icon = '🎬';
      else if (cat === 'doc') icon = '📑';
      else if (f.name.endsWith('.zip') || f.name.endsWith('.rar') || f.name.endsWith('.7z')) icon = '📦';

      const isSelected = ui.attSelectedFiles.has(f.name);
      const tags = (S.attTags[f.name] || []).map(tid => `<span class="att-tag">${esc(attCatName(tid))}</span>`).join('');

      html += `
        <div class="attachment-card ${isSelected ? 'selected' : ''}" data-name="${esc(f.name)}">
          <input type="checkbox" class="att-checkbox" data-cb-name="${esc(f.name)}" ${isSelected ? 'checked' : ''}>
          <div class="attachment-icon">${icon}</div>
          <div class="attachment-name" title="${esc(f.name)}">${esc(f.name)}</div>
          <div class="attachment-meta">${formatSize(f.size)}</div>
          <div class="att-tags">${tags || '<span class="att-tag" style="opacity:0.5">未分类</span>'}</div>
          <div class="att-actions">
            <button class="mini-btn" data-act="open">打开</button>
            <button class="mini-btn danger" data-act="delete">删除</button>
          </div>
        </div>
      `;
    });
    html += `</div>`;
    tableWrap.innerHTML = html;

    tableWrap.querySelectorAll('.attachment-card').forEach(card => {
      const name = card.dataset.name;
      
      card.querySelector('.att-checkbox').onchange = (e) => {
        e.stopPropagation();
        if (e.target.checked) ui.attSelectedFiles.add(name);
        else ui.attSelectedFiles.delete(name);
        card.classList.toggle('selected', e.target.checked);
        renderAttachmentsView();
      };

      card.onclick = (e) => {
        if (e.target.closest('.att-checkbox') || e.target.closest('button')) return;
        previewAttachment(name);
      };

      card.querySelector('[data-act="open"]').onclick = (e) => { e.stopPropagation(); openAttachmentWithSystem(name); };
      card.querySelector('[data-act="delete"]').onclick = (e) => { e.stopPropagation(); deleteAttachmentFile(name); };
    });
  };

  updateAttGrid();
}

/* ---------------- 附件操作 ---------------- */
function getFileCategory(filename) {
  const ext = filename.split('.').pop().toLowerCase();
  if (['jpg','jpeg','png','gif','webp','svg','bmp'].includes(ext)) return 'image';
  if (['mp4','avi','mov','wmv','flv','mkv','webm'].includes(ext)) return 'video';
  if (['pdf','doc','docx','xls','xlsx','ppt','pptx','txt','md','csv'].includes(ext)) return 'doc';
  return 'other';
}

async function previewAttachment(filename) {
  if (!attachmentDirHandle) return;
  try {
    const perm = await attachmentDirHandle.queryPermission({ mode: 'readwrite' });
    if (perm !== 'granted') { checkPermissionStatus(); return; }
    
    const fileHandle = await attachmentDirHandle.getFileHandle(filename);
    const file = await fileHandle.getFile();
    const url = URL.createObjectURL(file);
    const cat = getFileCategory(filename);

    let bodyHTML = '';
    if (cat === 'image') {
      bodyHTML = `<div style="text-align:center; background:rgba(0,0,0,.05); padding:10px; border-radius:8px;"><img src="${url}" style="max-width:100%; max-height:65vh; object-fit:contain;"></div>`;
    } else if (cat === 'video') {
      bodyHTML = `<div style="text-align:center; background:rgba(0,0,0,.05); padding:10px; border-radius:8px;"><video src="${url}" controls style="max-width:100%; max-height:65vh; outline:none;"></video></div>`;
    } else if (filename.toLowerCase().endsWith('.pdf')) {
      bodyHTML = `<iframe src="${url}" style="width:100%; height:65vh; border:none; border-radius:8px;"></iframe>`;
    } else if (filename.toLowerCase().match(/\.(txt|md|csv|json|xml)$/)) {
      const text = await file.text();
      bodyHTML = `<pre style="width:100%; height:65vh; overflow:auto; background:var(--bg); padding:12px; border-radius:8px; border:1px solid var(--border); font-family:monospace; font-size:13px; white-space:pre-wrap;">${esc(text)}</pre>`;
    } else {
      bodyHTML = `<div class="empty"><p>该文件类型暂不支持直接预览，你可以点击下方按钮下载或使用系统默认程序打开。</p></div>`;
    }

    openModal({
      title: `预览: ${filename}`,
      width: '800px',
      body: bodyHTML,
      footer: `<button class="btn" data-cancel>关闭</button><button class="btn btn-primary" id="downloadFileBtn">下载 / 系统打开</button>`,
      onMount(el, closeFn) {
        el.querySelector('[data-cancel]').onclick = () => { URL.revokeObjectURL(url); closeFn(); };
        el.querySelector('#downloadFileBtn').onclick = () => {
          const a = document.createElement('a');
          a.href = url; a.download = filename; document.body.appendChild(a); a.click();
          setTimeout(() => a.remove(), 100);
        };
      },
      onClose() { URL.revokeObjectURL(url); }
    });
  } catch (err) {
    console.error(err);
    toast('无法读取文件，可能已被移动或删除', 'error');
  }
}

async function openAttachmentWithSystem(filename) {
  if (!attachmentDirHandle) return;
  try {
    const perm = await attachmentDirHandle.queryPermission({ mode: 'readwrite' });
    if (perm !== 'granted') { checkPermissionStatus(); return; }

    const fileHandle = await attachmentDirHandle.getFileHandle(filename);
    const file = await fileHandle.getFile();
    const url = URL.createObjectURL(file);
    
    window.open(url, '_blank');
    setTimeout(() => { URL.revokeObjectURL(url); }, 10000);
  } catch (err) {
    console.error(err);
    toast('无法打开文件，可能已被移动或删除', 'error');
  }
}

async function deleteAttachmentFile(filename) {
  if (!attachmentDirHandle) return;
  
  if (!await confirmDialog({ title: '删除文件', message: `确定要删除附件「<b>${esc(filename)}</b>」吗？`, danger: true, okText: '继续' })) return;
  if (!await confirmDialog({ title: '彻底删除', message: '此操作将<b>直接从硬盘中删除该文件</b>，且无法恢复，请再次确认！', danger: true, okText: '确认删除' })) return;

  try {
    const perm = await attachmentDirHandle.queryPermission({ mode: 'readwrite' });
    if (perm !== 'granted') { checkPermissionStatus(); return; }

    await attachmentDirHandle.removeEntry(filename);
    
    if (S.attTags[filename]) { delete S.attTags[filename]; save(); }
    ui.attSelectedFiles.delete(filename);
    toast('文件已彻底删除');
    loadAttachments();
  } catch (err) {
    console.error(err);
    toast('删除文件失败', 'error');
  }
}

function openAttTagDialog() {
  const files = Array.from(ui.attSelectedFiles);
  if (files.length === 0) return;
  
  const body = document.createElement('div'); body.className = 'form';
  let html = `<div class="dialog-msg">正在给选中的 <b>${files.length}</b> 个文件设置分类。勾选代表加入，取消勾选代表移出。</div>`;
  
  S.attCategories.forEach(c => {
    const allHave = files.every(f => (S.attTags[f] || []).includes(c.id));
    const someHave = files.some(f => (S.attTags[f] || []).includes(c.id));
    const checked = allHave ? 'checked' : '';
    const indeterminate = (!allHave && someHave) ? 'data-indeterminate="true"' : '';
    html += `<label class="check-item" style="margin-top:8px;"><input type="checkbox" class="tag-cb" value="${c.id}" ${checked} ${indeterminate}><span>${esc(c.name)}</span></label>`;
  });
  
  if (S.attCategories.length === 0) html += `<div style="color:var(--muted);font-size:13px;margin-top:8px;">还没有自定义分类，请先在左侧边栏管理分类。</div>`;
  body.innerHTML = html;

  openModal({
    title: '设置分类标签', body, width: '400px',
    footer: `<button class="btn" data-cancel>取消</button><button class="btn btn-primary" data-save>确定</button>`,
    onMount(el, closeFn) {
      el.querySelectorAll('input[data-indeterminate="true"]').forEach(cb => cb.indeterminate = true);
      el.querySelector('[data-cancel]').onclick = closeFn;
      el.querySelector('[data-save]').onclick = () => {
        const selectedCats = [];
        el.querySelectorAll('.tag-cb:checked').forEach(cb => selectedCats.push(cb.value));
        files.forEach(f => {
          if (!S.attTags[f]) S.attTags[f] = [];
          S.attTags[f] = selectedCats.slice(); 
        });
        save();
        ui.attSelectedFiles.clear();
        closeFn();
        renderAttachmentsView();
        toast('标签已更新');
      };
    }
  });
}

function openManageAttCategories() {
  const body = document.createElement('div');
  const listEl = document.createElement('div');
  const addRow = document.createElement('div');
  
  addRow.innerHTML = `<div class="cat-add-row"><input class="input" id="newAttCatName" placeholder="输入新分类名称"><button class="btn btn-primary" id="addAttCatBtn">添加</button></div>`;
  body.appendChild(listEl); body.appendChild(addRow);

  const renderList = () => {
    listEl.innerHTML = S.attCategories.length ? S.attCategories.map(c => `
      <div class="cat-row" data-cid="${c.id}">
        <span class="cat-row-name">${esc(c.name)}</span>
        <button class="mini-btn" data-rename>改名</button>
        <button class="mini-btn danger" data-del>删除</button>
      </div>
    `).join('') : `<div style="color:var(--muted);font-size:13px;padding:8px 0">暂无分类</div>`;
  };
  renderList();

  openModal({
    title: '管理附件自定义分类', body, width: '480px', footer: `<button class="btn" data-cancel>关闭</button>`,
    onMount(el, closeFn) {
      el.querySelector('[data-cancel]').onclick = closeFn;
      
      el.querySelector('#addAttCatBtn').onclick = () => {
        const inp = el.querySelector('#newAttCatName');
        const name = inp.value.trim();
        if (!name) { toast('请输入分类名称', 'error'); return; }
        if (S.attCategories.some(c => c.name === name)) { toast('分类已存在', 'error'); return; }
        S.attCategories.push({ id: uid(), name });
        save();
        inp.value = '';
        renderList();
        renderAttachmentsSidebar();
        toast('已添加');
      };

      listEl.addEventListener('click', async e => {
        const row = e.target.closest('.cat-row'); if (!row) return;
        const cid = row.dataset.cid;
        const cat = S.attCategories.find(c => c.id === cid);
        if (!cat) return;

        if (e.target.closest('[data-del]')) {
          const ok = await confirmDialog({ title: '删除分类', message: `确定删除附件分类「<b>${esc(cat.name)}</b>」吗？`, danger: true, okText: '删除' });
          if (!ok) return;
          
          S.attCategories = S.attCategories.filter(c => c.id !== cid);
          for (let f in S.attTags) {
            S.attTags[f] = S.attTags[f].filter(t => t !== cid);
            if (S.attTags[f].length === 0) delete S.attTags[f];
          }
          if (ui.attCategory === cid) ui.attCategory = 'all';
          
          save();
          renderList();
          renderAttachmentsSidebar();
          renderAttachmentsView();
          toast('已删除');
          return;
        }

        if (e.target.closest('[data-rename]')) {
          const nameEl = row.querySelector('.cat-row-name');
          const old = cat.name;
          const input = document.createElement('input');
          input.className = 'input'; input.value = old; input.style.width = '140px';
          nameEl.replaceWith(input); input.focus(); input.select();

          const commit = () => {
            const v = input.value.trim();
            if (v && v !== old) {
              if (S.attCategories.some(c => c.name === v && c.id !== cid)) toast('分类名已存在', 'error');
              else { cat.name = v; save(); renderAttachmentsSidebar(); renderAttachmentsView(); }
            }
            renderList();
          };
          input.addEventListener('blur', commit);
          input.addEventListener('keydown', ev => {
            if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); }
            if (ev.key === 'Escape') { input.value = old; input.blur(); }
          });
        }
      });
    }
  });
}

  }).join('');

  el.innerHTML = `
    <div class="tb-row">

        <button class="btn btn-ghost" id="resetFilter">重置所有</button>
      </div>
      <div class="tb-group">
        <button class="btn btn-primary" id="addRecord">＋ 新增记录</button>
        ${ui.selectedIds.size > 0 ? `<button class="btn btn-danger" id="batchDelBtn">删除选中(${ui.selectedIds.size})</button>` : ''}
      </div>
    </div>
    ${filterTagsHTML ? `<div class="tb-row" style="padding-top:4px;">${filterTagsHTML}</div>` : ''}
  `;
  updateUndoRedoBtns();
}

function filteredRecords(t){
  let list = t.records.slice(); 
  const kw = (uiState.search[t.id] || '').trim().toLowerCase();
  
  if (kw) { 
    list = list.filter(r => t.fields.some(f => { 
      if (f.type === 'image') return false; 
      const v = f.type === 'category' ? catName(t, r[f.id]) : String(r[f.id] == null ? '' : r[f.id]); 
      return v.toLowerCase().includes(kw); 
    })); 
  }
  
  const catField = categoryField(t);
  const qCat = uiState.categoryId?.[t.id];
  if (catField && qCat) { 
    if (qCat === '__none__') list = list.filter(r => !r[catField.id]); 
    else list = list.filter(r => r[catField.id] === qCat); 
  }

  const filters = uiState.filters[t.id] || [];
  filters.forEach(f => {
    const field = t.fields.find(x => x.id === f.fieldId);
    if (!field) return;
    list = list.filter(r => {
      let v = r[f.fieldId] || '';
      if (field.type === 'category') v = catName(t, v);
      v = String(v).toLowerCase();
      return f.values.some(val => v.includes(String(val).toLowerCase()));
    });
  });

  list.sort((a, b) => {
    const nameF = nameField(t);
    const ka = a[nameF.id] || '', kb = b[nameF.id] || '';
    return ka.localeCompare(kb);
  });
  return list;
}

function cellHTML(f, r){
  const v = r[f.id];
  const t = currentTable();
  switch (f.type) {
    case 'textarea': return `<td><div class="cell-note" title="${esc(v)}">${esc(v || '')}</div></td>`;
    case 'category': { const c = t.categories.find(c => c.id === v); return `<td><span class="tag ${c ? '' : 'tag-muted'}">${c ? esc(c.name) : '未分类'}</span></td>`; }
    case 'select': return `<td>${v ? `<span class="tag">${esc(v)}</span>` : ''}</td>`;
    case 'date': return `<td class="cell-date">${esc(v || '')}</td>`;
    case 'datetime-local': return `<td class="cell-date">${esc(fmtDateTime(v))}</td>`;
    case 'image': return `<td class="cell-img">${v ? `<img class="thumb" src="${esc(v)}" loading="lazy" alt="">` : ''}</td>`;
    case 'number': return `<td class="cell-date">${esc(v == null ? '' : v)}</td>`;
    case 'file': return `<td>${v ? `<a class="file-link" data-file="${esc(v)}">📎 ${esc(v)}</a>` : ''}</td>`;
    default: 
      if (f.required) return `<td><div class="cell-name" title="${esc(v)}">${esc(v || '')}</div></td>`;
      return `<td><div class="cell-text" title="${esc(v)}">${esc(v || '')}</div></td>`;
  }
}

function rowOps(t, r){
  let html = `<button class="mini-btn" data-act="edit" data-id="${r.id}">编辑</button>`;
  
  const groups = S.settings.relationGroups || [];
  const targetTableIds = new Set();
  groups.forEach(g => {
    if (g.tableIds.includes(t.id)) {
      g.tableIds.forEach(id => {
        if (id !== t.id) targetTableIds.add(id);
      });
    }
  });

  targetTableIds.forEach(targetId => {
    const targetTable = S.tables.find(x => x.id === targetId);
    if (targetTable) {
      html += `<button class="mini-btn" data-act="flow" data-to="${targetId}" data-id="${r.id}">→ ${esc(targetTable.name)}</button>`;
    }
  });

  return html + `<button class="mini-btn danger" data-act="del" data-id="${r.id}">删除</button>`;
}

function renderTable(){
  const wrap = document.getElementById('tableWrap'); const t = currentTable(); if (!t) { wrap.innerHTML = ''; return; }
  const allFiltered = filteredRecords(t); 
  const total = allFiltered.length;
  const totalPages = Math.ceil(total / ui.pageSize) || 1;
  if (ui.page > totalPages) ui.page = totalPages;
  const start = (ui.page - 1) * ui.pageSize;
  const recs = allFiltered.slice(start, start + ui.pageSize);

  const cols = t.fields;
  
  const validIds = new Set(allFiltered.map(r => r.id));
  ui.selectedIds.forEach(id => { if (!validIds.has(id)) ui.selectedIds.delete(id); });
  const allSelected = recs.length > 0 && recs.every(r => ui.selectedIds.has(r.id));

  if (!allFiltered.length) { 
    wrap.innerHTML = `<div class="empty"><p>${t.records.length ? '没有符合条件的记录' : '这张表还没有记录，先加一条吧'}</p><button class="btn btn-primary" data-empty-add>＋ 新增记录</button></div>`; 
    renderPagination(0);
    return; 
  }
  
  const thead = `<tr>
    <th class="cb-col"><input type="checkbox" id="selectAllCb" ${allSelected ? 'checked' : ''}></th>
    ${cols.map(f => `<th>${esc(f.label)}</th>`).join('')}
    <th class="op-col">操作</th>
  </tr>`;
  
  const tbody = recs.map(r => {
    const isSel = ui.selectedIds.has(r.id);
    return `<tr data-id="${r.id}" class="${isSel ? 'selected' : ''}">
      <td class="cb-col"><input type="checkbox" class="row-cb" data-id="${r.id}" ${isSel ? 'checked' : ''}></td>
      ${cols.map(f => cellHTML(f, r)).join('')}
      <td class="op-col">${rowOps(t, r)}</td>
    </tr>`;
  }).join('');
  
  wrap.innerHTML = `<table class="data-table"><thead>${thead}</thead><tbody>${tbody}</tbody></table>`;
  renderPagination(total);
}

function renderPagination(total) {
  const pag = document.getElementById('pagination');
  const totalPages = Math.ceil(total / ui.pageSize) || 1;
  pag.innerHTML = `
    <span>共 <b>${total}</b> 条</span>
    <span>每页 <input type="number" id="pageSizeInput" value="${ui.pageSize}" min="1" max="1000"> 条</span>
    <button id="prevPage" ${ui.page <= 1 ? 'disabled' : ''}>上一页</button>
    <span>${ui.page} / ${totalPages}</span>
    <button id="nextPage" ${ui.page >= totalPages ? 'disabled' : ''}>下一页</button>
  `;
  pag.querySelector('#pageSizeInput').onchange = (e) => {
    let val = parseInt(e.target.value);
    if (isNaN(val) || val < 1) val = 20;
    if (val > 1000) val = 1000;
    ui.pageSize = val;
    ui.page = 1;
    renderTable();
  };
  pag.querySelector('#prevPage').onclick = () => { if (ui.page > 1) { ui.page--; renderTable(); } };
  pag.querySelector('#nextPage').onclick = () => { if (ui.page < totalPages) { ui.page++; renderTable(); } };
}

function switchTable(id){ 
  ui.currentView = 'table';
  ui.tableId = id; ui.selectedIds.clear(); ui.page = 1;
  try { localStorage.setItem('dfy_last_table', id); } catch(e){}
  renderView(); 
}

/* ---------------- 表单操作 ---------------- */
function fieldInputHTML(t, f, val){
  const v = esc(val == null ? '' : val);
  switch (f.type) {
    case 'textarea': return `<textarea class="input" data-fid="${f.id}" rows="3" placeholder="补充说明">${v}</textarea>`;
    case 'number': return `<input class="input" type="number" data-fid="${f.id}" value="${v}">`;
    case 'select': return `<select class="input" data-fid="${f.id}"><option value="">请选择</option>${(f.options || []).map(o => `<option value="${esc(o)}" ${val === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    case 'category': return `<select class="input" data-fid="${f.id}"><option value="">未分类</option>${t.categories.map(c => `<option value="${c.id}" ${val === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>`;
    case 'date': return `<input class="input" type="date" data-fid="${f.id}" value="${v}">`;
    case 'datetime-local': return `<input class="input" type="datetime-local" data-fid="${f.id}" value="${v}">`;
    case 'image': return `<div class="img-field" data-fid="${f.id}"><input type="hidden" class="img-value" value="${v}"><input type="file" accept="image/*" class="img-file" hidden><div class="img-preview">${val ? `<img src="${esc(val)}" alt="图片">` : '<span class="img-empty">暂无图片</span>'}</div><div class="img-actions"><button type="button" class="btn img-pick">选择图片</button><button type="button" class="btn img-clear" ${val ? '' : 'hidden'}>清除</button></div></div>`;
    case 'file': return `<div class="file-field" data-fid="${f.id}"><input type="hidden" class="file-value" value="${v}"><input type="file" class="file-input" hidden><div class="img-actions" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;"><button type="button" class="btn file-pick" style="border-color:var(--accent);color:var(--accent);">选择文件上传</button><span class="file-name" style="font-size:13px;color:var(--text);word-break:break-all;">${val ? '📎 ' + esc(val) : '未选择文件'}</span><button type="button" class="btn file-clear" ${val ? '' : 'hidden'} style="margin-left:auto;">清除</button></div></div>`;
    default: return `<input class="input" type="text" data-fid="${f.id}" value="${v}" placeholder="请输入${esc(f.label)}">`;
  }
}
function bindImageFields(container){
  container.querySelectorAll('.img-field').forEach(wrap => {
    const hidden = wrap.querySelector('.img-value'), fileInp = wrap.querySelector('.img-file'), preview = wrap.querySelector('.img-preview'), pick = wrap.querySelector('.img-pick'), clear = wrap.querySelector('.img-clear');
    pick.onclick = () => { fileInp.value = ''; fileInp.click(); };
    fileInp.onchange = async () => {
      const file = fileInp.files[0]; if (!file) return;
      try { const dataUrl = await compressImage(file, 600, 0.55); hidden.value = dataUrl; preview.innerHTML = `<img src="${dataUrl}" alt="图片">`; clear.hidden = false; } catch (e) { toast('图片处理失败', 'error'); }
    };
    clear.onclick = () => { hidden.value = ''; preview.innerHTML = '<span class="img-empty">暂无图片</span>'; clear.hidden = true; };
  });
}
function bindFileFields(container){
  container.querySelectorAll('.file-field').forEach(wrap => {
    const hidden = wrap.querySelector('.file-value'), fileInp = wrap.querySelector('.file-input'), nameEl = wrap.querySelector('.file-name'), pick = wrap.querySelector('.file-pick'), clear = wrap.querySelector('.file-clear');
    
    pick.onclick = async () => { 
      if (!attachmentDirHandle) { toast('请先在设置 -> 附件仓库中指定一个文件夹', 'error'); return; }
      const perm = await attachmentDirHandle.queryPermission({ mode: 'readwrite' });
      if (perm !== 'granted') { checkPermissionStatus(); return; }
      fileInp.value = ''; fileInp.click(); 
    };
    
    fileInp.onchange = async () => {
      const file = fileInp.files[0]; if (!file) return;
      try {
        const perm = await attachmentDirHandle.queryPermission({ mode: 'readwrite' });
        if (perm !== 'granted') { checkPermissionStatus(); return; }
        
        let fName = file.name;
        let finalName = fName;
        let idx = 1;
        while (true) {
          try {
            await attachmentDirHandle.getFileHandle(finalName);
            const extIdx = fName.lastIndexOf('.');
            const base = extIdx > -1 ? fName.slice(0, extIdx) : fName;
            const ext = extIdx > -1 ? fName.slice(extIdx) : '';
            finalName = `${base}_${idx}${ext}`;
            idx++;
          } catch (e) { break; }
        }

        const newHandle = await attachmentDirHandle.getFileHandle(finalName, { create: true });
        const writable = await newHandle.createWritable();
        await writable.write(file);
        await writable.close();

        hidden.value = finalName;
        nameEl.textContent = `📎 ${finalName}`;
        clear.hidden = false;
        toast('文件已存入仓库');
      } catch (err) {
        console.error(err);
        toast('文件写入失败', 'error');
      }
    };
    clear.onclick = () => { hidden.value = ''; nameEl.textContent = '未选择文件'; clear.hidden = true; };
  });
}

function openRecordForm(table, record){
  if (!table) return; const isEdit = !!record; const fields = table.fields;
  const form = document.createElement('div'); form.className = 'form';
  form.innerHTML = fields.map(f => `<div class="form-row"><label>${esc(f.label)}${f.required ? ' <span class="req">*</span>' : ''}</label>${fieldInputHTML(table, f, record ? record[f.id] : '')}</div>`).join('');
  openModal({
    title: isEdit ? '编辑记录' : '新增记录', body: form,
    footer: `<button class="btn" data-cancel>取消</button><button class="btn btn-primary" data-save>保存</button>`,
    onMount(el, closeFn){
      bindImageFields(form);
      bindFileFields(form);
      el.querySelector('[data-cancel]').onclick = closeFn;
      el.querySelector('[data-save]').onclick = () => {
        const data = {};
        fields.forEach(f => {
          if (f.type === 'image') { const wrap = form.querySelector(`.img-field[data-fid="${f.id}"]`); data[f.id] = wrap ? wrap.querySelector('.img-value').value : ''; }
          else if (f.type === 'file') { const wrap = form.querySelector(`.file-field[data-fid="${f.id}"]`); data[f.id] = wrap ? wrap.querySelector('.file-value').value : ''; }
          else { const inp = form.querySelector(`[data-fid="${f.id}"]`); data[f.id] = inp ? (f.type === 'textarea' ? inp.value : inp.value.trim()) : ''; }
        });
        const reqField = fields.find(f => f.required); if (reqField && !data[reqField.id]) { toast(`「${reqField.label}」不能为空`, 'error'); return; }
        
        pushUndo(); 
        if (isEdit) Object.assign(record, data, { updatedAt: Date.now() });
        else table.records.push(Object.assign({ id: uid(), createdAt: Date.now(), updatedAt: Date.now() }, data));
        save(); 
        closeFn(); renderView(); toast(isEdit ? '已保存' : '已新增');
      };
    }
  });
}
async function deleteRecord(t, rec){
  const nf = nameField(t); const title = rec[nf.id] || '这条记录';
  if (!await confirmDialog({ title: '删除记录', message: `确定要删除「<b>${esc(title)}</b>」吗？`, danger: true, okText: '继续' })) return;
  if (!await confirmDialog({ title: '再次确认', message: '删除后不可恢复，请再次确认。', danger: true, okText: '确认删除' })) return;
  
  pushUndo(); 
  t.records = t.records.filter(r => r.id !== rec.id); 
  ui.selectedIds.delete(rec.id);
  save(); renderView(); toast('已删除');
}
async function batchDeleteRecords(t) {
  if (ui.selectedIds.size === 0) return;
  if (!await confirmDialog({ title: '批量删除', message: `确定要删除选中的 <b>${ui.selectedIds.size}</b> 条记录吗？`, danger: true, okText: '确认删除' })) return;
  
  pushUndo(); 
  t.records = t.records.filter(r => !ui.selectedIds.has(r.id));
  ui.selectedIds.clear();
  save(); renderView(); toast('已批量删除');
}
function flowRecord(t, rec, toTargetId){
  const target = S.tables.find(x => x.id === toTargetId); if (!target) { toast('目标表不存在', 'error'); return; }
  
  pushUndo(); 
  t.records = t.records.filter(r => r.id !== rec.id); target.records.push(Object.assign({}, rec, { id: uid(), updatedAt: Date.now() }));
  ui.selectedIds.delete(rec.id);
  save(); renderView(); toast(`已流转到「${target.name}」`);
}

        let req = clean.find(f => f.required); if (!req) { clean[0].required = true; req = clean[0]; } clean.forEach(f => { if (f !== req) delete f.required; }); req.type = 'text'; delete req.options;
        const keepIds = new Set(clean.map(f => f.id)); originalIds.filter(id => !keepIds.has(id)).forEach(id => { t.records.forEach(r => { delete r[id]; }); });
        
        pushUndo();
