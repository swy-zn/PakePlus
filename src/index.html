<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大肥鱼工作台</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
<style>
/* ============ 主题变量 ============ */
:root{
  --bg:#eef1f7;
  --panel-alpha:0.75; --panel-solid-alpha:1;
  --panel:rgba(255,255,255,var(--panel-alpha));
  --panel-solid:rgba(255,255,255,var(--panel-solid-alpha));
  --text:#1f2937; --muted:#6b7280; --border:#e3e8f0;
  --accent:#4f7cff; --accent-soft:rgba(79,124,255,.12);
  --danger:#ef4444; --danger-soft:rgba(239,68,68,.12); --ok:#10b981;
  --shadow:0 6px 24px rgba(17,24,39,.10); --radius:12px;
}
html[data-theme="dark"]{
  --bg:#0d1220;
  --panel:rgba(22,29,45,var(--panel-alpha));
  --panel-solid:rgba(22,29,45,var(--panel-solid-alpha));
  --text:#e6ebf5; --muted:#94a1b8; --border:#26304a;
  --accent:#5f8bff; --accent-soft:rgba(95,139,255,.16);
  --danger:#f26b6b; --danger-soft:rgba(242,107,107,.14);
  --shadow:0 6px 24px rgba(0,0,0,.4);
}
/* ============ 基础 ============ */
*{box-sizing:border-box;}
html,body{height:100%;margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  font-size:14px;color:var(--text);background:var(--bg);overflow:hidden;
  -webkit-font-smoothing:antialiased;transition:background 0.3s, color 0.3s;
  display: flex; flex-direction: column;
}
#bgLayer{
  position:fixed;inset:-24px;z-index:0;display:none;
  background-size:cover;background-position:center;background-repeat:no-repeat;
  transition:opacity .3s,filter .3s;
}
#app{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;min-height:0;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:rgba(140,150,170,.4);border-radius:6px;}
::-webkit-scrollbar-thumb:hover{background:rgba(140,150,170,.65);}
::-webkit-scrollbar-track{background:transparent;}

/* ============ 权限恢复横幅 ============ */
#permissionBanner {
  display: none; background: #fef3c7; color: #92400e; padding: 10px 16px; font-size: 13px;
  border-bottom: 1px solid #fcd34d; align-items: center; justify-content: space-between; z-index: 100; position: relative;
}
html[data-theme="dark"] #permissionBanner { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border-bottom-color: rgba(245, 158, 11, 0.3); }
#permissionBanner button { background: #d97706; color: white; border: none; padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
#permissionBanner button:hover { background: #b45309; }

/* ============ 头部 ============ */
.app-header{
  display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 16px;
  background:var(--panel);border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);flex-shrink:0;
}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap;}
.logo{font-size:20px;line-height:1;}
.brand-name{font-size:15px;font-weight:600;letter-spacing:.3px;}
.header-actions{display:flex;gap:8px;align-items:center;}

/* ============ 标签栏与操作 ============ */
.tabs-container{
  display:flex;justify-content:space-between;align-items:center;padding:8px 16px;
  background:var(--panel);border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);flex-shrink:0;
}
.tabs-left{display:flex;gap:8px;flex:1;min-width:0;align-items:center;}
.tabs-right{display:flex;gap:8px;flex-shrink:0;margin-left:16px;align-items:center;}

.tab{
  padding:0 14px; height:34px; border-radius:9px; border:1px solid transparent; background:transparent;
  color:var(--muted);cursor:pointer;font-size:13px;white-space:nowrap;font-family:inherit;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.15s;flex-shrink:0;
}
.tab:hover{background:var(--accent-soft);color:var(--text);}
.tab.active{background:var(--accent);color:#fff;}
.tab-count{font-size:11px;padding:0 6px;border-radius:8px;background:rgba(125,125,125,.22);}
.tab.active .tab-count{background:rgba(255,255,255,.28);}
.tab-add{border:1px dashed var(--border);color:var(--muted);}
.tab-repo { border: 1px solid var(--border); background: var(--panel-solid); font-weight: 600; font-size: 14px; }
.tab-repo.active { border-color: var(--accent); }

/* 表名切换组：表名按钮 + ▾ 分离列 */
#tableSwitcher{
  display:inline-flex;align-items:center;gap:6px;flex-shrink:0;height:34px;
}
#btnCurrentTable{
  border:1px solid var(--border);background:var(--panel-solid);border-radius:9px;
  padding:0 14px;font-size:14px;font-weight:600;height:100%;
  color:var(--text);font-family:inherit;display:flex;align-items:center;white-space:nowrap;
  max-width:240px;overflow:hidden;text-overflow:ellipsis;cursor:default;
}
#btnTableDropdown{
  border:1px solid var(--border);background:var(--panel-solid);border-radius:9px;
  padding:0 12px;font-size:12px;height:100%;cursor:pointer;color:var(--muted);font-family:inherit;
  display:flex;align-items:center;justify-content:center;transition:.15s;
}
#btnTableDropdown:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}

/* 表切换弹层 */
.table-search-popover {
  position: absolute; top: 50px; left: 16px; z-index: 1000;
  width: 250px; background: var(--panel-solid); border: 1px solid var(--border);
  border-radius: 12px; box-shadow: var(--shadow); display: none; flex-direction: column; overflow: hidden;
}
.table-search-popover.show { display: flex; }
.tsp-search-wrap { padding: 8px; border-bottom: 1px solid var(--border); }
.tsp-search-wrap input { width: 100%; padding: 6px 10px; border-radius: 6px; font-size: 13px; border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none; transition: 0.2s; }
.tsp-search-wrap input:focus { border-color: var(--accent); }
.tsp-list { max-height: 300px; overflow-y: auto; }
.tsp-item { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 13px; display: flex; justify-content: space-between; align-items:center; }
.tsp-item:last-child { border-bottom: none; }
.tsp-item:hover { background: var(--accent-soft); }
.tsp-item.active { color: var(--accent); font-weight: bold; background: var(--accent-soft); }
.tsp-empty { padding: 14px; text-align: center; color: var(--muted); font-size: 12px; }

/* ============ 主体 (毛玻璃区域) ============ */
.main{flex:1;display:flex;min-height:0;}
.sidebar{
  width:210px;flex-shrink:0;padding:12px;overflow-y:auto;
  background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;gap:8px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.side-title{font-size:12px;color:var(--muted);font-weight:600;padding:0 4px;}
.cat-list{display:flex;flex-direction:column;gap:2px;}
.cat-item{
  display:flex;justify-content:space-between;align-items:center;gap:6px;
  padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:13px;transition:.12s;
}
.cat-item:hover{background:var(--accent-soft);color:var(--text);}
.cat-item.active{background:var(--accent);color:#fff;}
.cat-item.active .cat-num{color:rgba(255,255,255,.9);}
.cat-num{font-size:11px;opacity:.85;}
.side-foot{font-size:11px;color:var(--muted);text-align:center;padding:6px 0 0;}
.content{flex:1;display:flex;flex-direction:column;min-width:0;padding:12px 16px;gap:10px;}

/* ============ 工具栏 ============ */
.toolbar{display:flex;flex-direction:column;gap:8px;flex-shrink:0;position:relative;}
.tb-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;}
.tb-group{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

/* 筛选条件胶囊 */
.filter-tag {
  display: flex;align-items: center;gap: 6px;
  background: var(--accent-soft);border: 1px solid var(--accent);
  padding: 4px 10px;border-radius: 20px;font-size: 12px;
}
.filter-tag span { color: var(--accent);font-weight: bold; }
.filter-tag button { background: none;border: none;color: var(--accent);cursor: pointer;font-weight: bold;padding: 0; }

/* ============ 控件 ============ */
.input{
  padding:7px 10px;border-radius:9px;border:1px solid var(--border);
  background:var(--panel-solid);color:var(--text);font-size:13px;font-family:inherit;
  outline:none;transition:.15s;min-width:0;
}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.search{width:220px;}
select.input{cursor:pointer;}
textarea.input{resize:vertical;min-height:70px;line-height:1.5;}

.btn{
  padding:7px 13px;border-radius:9px;border:1px solid var(--border);
  background:var(--panel-solid);color:var(--text);cursor:pointer;font-size:13px;
  font-family:inherit;transition:.15s;white-space:nowrap;
}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
.btn:disabled{cursor:not-allowed;opacity:0.5;}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover:not(:disabled){filter:brightness(1.08);color:#fff;}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff;}
.btn-danger:hover:not(:disabled){filter:brightness(1.08);color:#fff;}
.btn-ghost{background:transparent;}
.btn-block{width:100%;}
.icon-btn{
  width:34px;height:34px;border-radius:9px;border:1px solid var(--border);
  background:var(--panel-solid);cursor:pointer;font-size:15px;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;color:var(--text);transition:.15s;
}
.icon-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
.icon-btn:disabled{opacity:0.3;cursor:not-allowed;}
.mini-btn{
  padding:4px 9px;border-radius:7px;border:1px solid var(--border);background:transparent;
  color:var(--muted);cursor:pointer;font-size:12px;font-family:inherit;margin-left:4px;transition:.15s;
}
.mini-btn:hover{border-color:var(--accent);color:var(--accent);}
.mini-btn.danger:hover{border-color:var(--danger);color:var(--danger);}

/* ============ 筛选浮层 ============ */
.filter-popover {
  position: absolute; top: 40px; left: 260px; z-index: 1000;
  width: 280px; background: var(--panel-solid); border: 1px solid var(--border);
  border-radius: 8px; box-shadow: var(--shadow); display: none; flex-direction: column;
  font-size: 12px; overflow: hidden;
}
.filter-popover.show { display: flex; }
.fp-header { padding: 10px; border-bottom: 1px solid var(--border); }
.fp-search { width: 100%; padding: 6px 8px; font-size: 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none; }
.fp-search:focus { border-color: var(--accent); }
.fp-actions { padding: 8px 10px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; color: var(--muted); }
.fp-actions a { color: var(--accent); text-decoration: none; margin-left: 8px; cursor: pointer; }
.fp-actions a:hover { text-decoration: underline; }
.fp-list { max-height: 250px; overflow-y: auto; }
.fp-item { border-bottom: 1px solid var(--border); }
.fp-item:last-child { border-bottom: none; }
.fp-field-row { display: flex; align-items: center; padding: 8px 10px; cursor: pointer; transition: .1s; }
.fp-field-row:hover { background: var(--bg); }
.fp-field-row input[type="checkbox"] { margin-right: 8px; accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; }
.fp-field-row label { cursor: pointer; flex: 1; user-select: none; }
.fp-values { padding: 6px 10px 10px 30px; background: var(--bg); display: none; }
.fp-item.expanded .fp-values { display: block; }
.fp-val-item { display: flex; align-items: center; margin-bottom: 4px; }
.fp-val-item input[type="checkbox"] { margin-right: 6px; accent-color: var(--accent); cursor: pointer; }
.fp-val-input { width: 100%; padding: 4px 8px; font-size: 12px; border-radius: 4px; border: 1px solid var(--border); background: var(--panel-solid); color: var(--text); outline: none; }

/* ============ 表格与分页 ============ */
.table-wrap{
  flex:1;overflow:auto;border-radius:var(--radius);border:1px solid var(--border);
  background:var(--panel);min-height:0;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;flex-direction:column;
}
.data-table{width:100%;border-collapse:collapse;font-size:13px;}
.data-table thead th{
  position:sticky;top:0;z-index:2;text-align:left;padding:10px 12px;
  background:var(--panel-solid);border-bottom:1px solid var(--border);
  font-weight:600;color:var(--muted);font-size:12px;white-space:nowrap;
}
.data-table td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top;}
.data-table tbody tr:hover{background:var(--accent-soft);}
.data-table tbody tr.selected{background:rgba(79,124,255,.08);}

/* 长文本：自动换行 + 可拖拽高度 */
.cell-name, .cell-note, .cell-text {
  min-width: 120px;
  min-height: 24px;
  max-height: 400px;
  overflow-y: auto;
  resize: vertical;
  word-break: break-word;
  white-space: normal;
  line-height: 1.5;
  display: block;
  padding: 4px 6px;
  border: 1px dashed transparent;
  transition: border-color .2s;
}
.cell-name:hover, .cell-note:hover, .cell-text:hover {
  border-color: var(--border);
}
.cell-name { font-weight: 600; }
.cell-note { color: var(--muted); }

.cell-date{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;}
.op-col{width:1%;white-space:nowrap;text-align:right;}
.cb-col{width:1%;padding-right:0;}
.cb-col input{accent-color:var(--accent);cursor:pointer;}

.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;}
.tag-muted{background:rgba(125,125,125,.14);color:var(--muted);}
.p-high{background:var(--danger-soft);color:var(--danger);}
.p-mid{background:rgba(245,158,11,.16);color:#d97706;}
.p-low{background:rgba(16,185,129,.14);color:var(--ok);}

.pagination{
  display:flex;align-items:center;justify-content:flex-end;gap:12px;
  padding:10px 16px;border-top:1px solid var(--border);
  background:var(--panel);font-size:13px;color:var(--muted);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-radius: 0 0 var(--radius) var(--radius);
}
.pagination input { width: 60px; padding: 4px; text-align: center; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none; }
.pagination button { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; }
.pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
.pagination button:not(:disabled):hover { border-color: var(--accent); color: var(--accent); }

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:240px;
