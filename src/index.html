let currentFilterPopover = null;

function openFilterPopover(anchorEl) {
  const t = currentTable();
  if (!t) return;
  
  const popover = document.getElementById('filterPopover');
  const fpList = document.getElementById('fpList');
  const fpSearch = document.getElementById('fpSearch');
  const fpCount = document.getElementById('fpCount');
  
  const rect = anchorEl.getBoundingClientRect();
  popover.style.top = (rect.bottom + 8) + 'px';
  popover.style.left = rect.left + 'px';
  
  popover.classList.add('show');
  fpSearch.value = '';
  
  let appliedFilters = uiState.filters[t.id] || [];
  
  const renderList = (searchKw = '') => {
    let html = '';
    let selectedCount = 0;
    
    t.fields.forEach(f => {
      if (f.type === 'image' || f.type === 'file') return; 
      if (!f.label.includes(searchKw) && !f.id.includes(searchKw)) return;
      
      const activeFilter = appliedFilters.find(af => af.fieldId === f.id);
      const isEnabled = !!activeFilter;
      if (isEnabled) selectedCount++;
      
      html += `<div class="fp-item ${isEnabled ? 'expanded' : ''}" data-fid="${f.id}">
        <div class="fp-field-row">
          <input type="checkbox" class="fp-field-cb" ${isEnabled ? 'checked' : ''}>
          <label>${esc(f.label)}</label>
        </div>
        <div class="fp-values">
      `;
      
      if (f.type === 'select' || f.type === 'category') {
        const vals = f.type === 'select' ? (f.options || []) : t.categories.map(c => ({ id: c.id, name: c.name }));
        vals.forEach(v => {
          const valId = f.type === 'select' ? v : v.id;
          const valName = f.type === 'select' ? v : v.name;
          const checked = activeFilter && activeFilter.values.includes(valId) ? 'checked' : '';
          html += `<label class="fp-val-item"><input type="checkbox" class="fp-val-cb" data-val="${esc(valId)}" ${checked}> ${esc(valName)}</label>`;
        });
      } else if (f.type === 'date') {
        const val = activeFilter && activeFilter.values[0] ? activeFilter.values[0] : '';
        html += `<input type="date" class="fp-val-input fp-date-input" value="${esc(val)}" style="width:100%; padding:4px; border-radius:4px; border:1px solid var(--border); background:var(--panel-solid); color:var(--text);">`;
      } else if (f.type === 'datetime-local') {
        const val = activeFilter && activeFilter.values[0] ? activeFilter.values[0] : '';
        html += `<input type="datetime-local" class="fp-val-input fp-date-input" value="${esc(val)}" style="width:100%; padding:4px; border-radius:4px; border:1px solid var(--border); background:var(--panel-solid); color:var(--text);">`;
      } else {
        const val = activeFilter && activeFilter.values[0] ? activeFilter.values[0] : '';
        html += `<input type="text" class="fp-val-input" placeholder="包含该文字..." value="${esc(val)}">`;
      }
      
      html += `</div></div>`;
    });
    
    fpList.innerHTML = html;
    fpCount.textContent = `已选 ${selectedCount} 项`;
    
    fpList.querySelectorAll('.fp-item').forEach(item => {
      const fid = item.dataset.fid;
      const field = t.fields.find(x => x.id === fid);
      const cb = item.querySelector('.fp-field-cb');
      
      cb.onchange = () => {
        if (cb.checked) {
          item.classList.add('expanded');
          if (!appliedFilters.find(af => af.fieldId === fid)) {
            appliedFilters.push({ fieldId: fid, values: [] });
            updateFilters();
          }
        } else {
          item.classList.remove('expanded');
          appliedFilters = appliedFilters.filter(af => af.fieldId !== fid);
          updateFilters();
        }
        fpCount.textContent = `已选 ${appliedFilters.length} 项`;
      };
      
      item.querySelectorAll('.fp-val-cb').forEach(vcb => {
        vcb.onchange = () => {
          let af = appliedFilters.find(af => af.fieldId === fid);
          if (!af) { af = { fieldId: fid, values: [] }; appliedFilters.push(af); }
          const val = vcb.dataset.val;
          if (vcb.checked) { if (!af.values.includes(val)) af.values.push(val); } else { af.values = af.values.filter(v => v !== val); }
          updateFilters();
        };
      });
      
      const inp = item.querySelector('.fp-val-input');
      if (inp) {
        const eventName = (field.type === 'date' || field.type === 'datetime-local') ? 'change' : 'input';
        inp.addEventListener(eventName, () => {
          let af = appliedFilters.find(af => af.fieldId === fid);
          if (!af) { af = { fieldId: fid, values: [] }; appliedFilters.push(af); }
          af.values = inp.value.trim() ? [inp.value.trim()] : [];
          updateFilters();
        });
      }
    });
  };
  
  const updateFilters = () => {
    const validFilters = appliedFilters.filter(af => af.values.length > 0);
    uiState.filters[t.id] = validFilters;
    saveUiState();
    renderToolbar();
    renderTable();
    fpCount.textContent = `已选 ${appliedFilters.length} 项`;
  };
  
  renderList();
  fpSearch.oninput = () => renderList(fpSearch.value.trim());
  
  document.getElementById('fpSelectAll').onclick = () => {
    t.fields.forEach(f => {
      if (f.type === 'image' || f.type === 'file') return; 
      if (fpSearch.value && !f.label.includes(fpSearch.value)) return;
      if (!appliedFilters.find(af => af.fieldId === f.id)) appliedFilters.push({ fieldId: f.id, values: [] });
    });
    renderList(fpSearch.value.trim());
    updateFilters();
  };
  
  document.getElementById('fpClear').onclick = () => {
    appliedFilters = [];
    renderList(fpSearch.value.trim());
    updateFilters();
  };
  
  currentFilterPopover = (e) => {
    if (!popover.contains(e.target) && e.target !== anchorEl) {
      popover.classList.remove('show');
      document.removeEventListener('click', currentFilterPopover);
      currentFilterPopover = null;
    }
  };
  setTimeout(() => document.addEventListener('click', currentFilterPopover), 10);
}

/* ---------------- Excel 导入导出 ---------------- */
async function saveFileAs(content, filename, mimeType, fileTypes) {
  return new Promise(async (resolve) => {
    if (window.showSaveFilePicker) {
      try {
        const handle = await window.showSaveFilePicker({ suggestedName: filename, types: fileTypes });
        const writable = await handle.createWritable();
        await writable.write(content);
        await writable.close();
        toast('保存成功');
        resolve(true);
        return;
      } catch (err) {
        if (err.name === 'AbortError') { resolve(false); return; }
        console.warn('File System API 失败，尝试降级下载', err);
      }
    }
    try {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 200);
      toast('已下载到默认文件夹');
      resolve(true);
    } catch (e) { toast('下载失败', 'error'); resolve(false); }
  });
}

function buildTableExcel(t, isTemplate = false) {
  const wb = XLSX.utils.book_new();
  const cols = t.fields;
  const header = cols.map(f => f.label);
  const catField = categoryField(t);
  
  if (isTemplate) {
    const now = new Date();
    const sample = cols.map(f => {
      if (f.type === 'image' || f.type === 'file') return '';
      if (f.type === 'category') return (t.categories[0] && t.categories[0].name) || '工作';
      if (f.type === 'select') return (f.options && f.options[0]) || '';
      if (f.type === 'number') return 1;
      if (f.type === 'date') return now.toISOString().slice(0, 10);
      if (f.type === 'datetime-local') return now.toISOString().slice(0, 16).replace('T', ' ');
      return '示例' + f.label;
    });
    const ws = XLSX.utils.aoa_to_sheet([header, sample]);
    XLSX.utils.book_append_sheet(wb, ws, catField ? "未分类" : "数据表");
    return wb;
  }

  const records = filteredRecords(t);
  const groupedData = {}; 
  
  records.forEach(r => {
    let catId = catField ? (r[catField.id] || '') : '';
    if (!groupedData[catId]) groupedData[catId] = [];
    groupedData[catId].push(r);
  });

  if (catField) {
    t.categories.forEach(c => { if (!groupedData[c.id]) groupedData[c.id] = []; });
    if (!groupedData['']) groupedData[''] = [];
  } else {
    if (!groupedData['']) groupedData[''] = records;
  }

  for (const catId in groupedData) {
    const sheetName = catId ? catName(t, catId) : (catField ? '未分类' : '数据表');
    const recs = groupedData[catId];
    const data = recs.map(r => cols.map(f => {
      if (f.type === 'category') return catName(t, r[f.id]);
      if (f.type === 'image' || f.type === 'file') return r[f.id] ? r[f.id].substring(0, 32000) : ''; 
      return r[f.id] == null ? '' : r[f.id];
    }));
    
    const ws = XLSX.utils.aoa_to_sheet([header, ...data]);
    let safeName = sheetName.replace(/[\\\/\?\*\[\]\:]/g, '_').slice(0, 31);
    let finalName = safeName, idx = 1;
    while (wb.SheetNames.includes(finalName)) { finalName = safeName.slice(0, 28) + '_' + idx; idx++; }
    XLSX.utils.book_append_sheet(wb, ws, finalName);
  }

  return wb;
}

async function exportExcel(t) {
  if (!t) return;
  if (typeof XLSX === 'undefined') { toast('Excel 组件未加载', 'error'); return; }
  const wb = buildTableExcel(t, false);
  const buffer = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  await saveFileAs(buffer, `${t.name}.xlsx`, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', [{ description: 'Excel 文件', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] } }]);
}

async function downloadExcelTemplate(t) {

}

async function processFiles(files, isRestore, fallbackTableId) {
  if (!files || files.length === 0) return;
  if (typeof XLSX === 'undefined') { toast('Excel 组件未加载', 'error'); return; }
  
  let processedCount = 0;
  let errorFiles = [];

  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    const fileName = file.name.replace(/\.xlsx$/i, '');
    
    const buffer = await file.arrayBuffer();
    const workbook = XLSX.read(buffer, { type: 'array' });
    
    let t = S.tables.find(x => x.name === fileName);
    if (!t && !isRestore) t = S.tables.find(x => x.id === fallbackTableId) || currentTable();
    if (!t) { errorFiles.push(file.name); continue; }

    if (isRestore) t.records = [];

    let importCount = 0;
    workbook.SheetNames.forEach(sheetName => {
      if (sheetName === '数据表' || sheetName === '分类数据') return; 

      let catId = '';
      if (sheetName !== '未分类') {
        let c = t.categories.find(x => x.name === sheetName);
        if (!c) { c = { id: uid(), name: sheetName }; t.categories.push(c); }
        catId = c.id;
      }

      const ws = workbook.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
      if (rows.length < 2) return;

      const header = rows[0].map(h => String(h).trim());
      const colMap = {};
      header.forEach((h, idx) => { const f = t.fields.find(f => f.label === h || f.id === h); if (f) colMap[idx] = f; });

      for (let j = 1; j < rows.length; j++) {
        const row = rows[j]; const rec = {};
        for (const [idx, f] of Object.entries(colMap)) {
          let v = String(row[idx] == null ? '' : row[idx]).trim();
          if (!v) continue;
          if (f.type === 'category') continue;
          if (f.type === 'select') { rec[f.id] = (f.options || []).includes(v) ? v : ''; continue; }
          if (f.type === 'image' || f.type === 'file') { rec[f.id] = v; continue; }
          
          if ((f.type === 'date' || f.type === 'datetime-local') && v.includes('/')) {
             const d = new Date(v);
             if (!isNaN(d.getTime())) {
               if (f.type === 'date') v = d.toISOString().slice(0, 10);
               else v = d.toISOString().slice(0, 16);
             }
          }
          rec[f.id] = v;
        }
        const req = t.fields.find(f => f.required); if (!req || !rec[req.id]) continue;
        
        const catField = categoryField(t);
        if (catField) rec[catField.id] = catId;

        rec.id = uid(); rec.createdAt = Date.now(); rec.updatedAt = Date.now();
        t.records.push(rec);
        importCount++;
      }
    });
    processedCount++;
  }

  save();
  renderView();
  
  if (errorFiles.length > 0) toast(`处理完成，但有 ${errorFiles.length} 个文件未匹配到对应表: ${errorFiles.join(', ')}`, 'error');
  else toast(`成功处理 ${processedCount} 个文件`);
}

async function backupAll() {
  if (typeof XLSX === 'undefined') { toast('Excel 组件未加载', 'error'); return; }
  
  if (window.showDirectoryPicker) {
    try {
      const dirHandle = await window.showDirectoryPicker({ id: 'backup', mode: 'readwrite' });
      
      for (const t of S.tables) {
        const wb = buildTableExcel(t, false);
        const buffer = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
        const fileName = t.name.replace(/[\\\/\?\*\[\]\:]/g, '_') + '.xlsx';
        
        const fileHandle = await dirHandle.getFileHandle(fileName, { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(buffer);
        await writable.close();
      }
      toast('备份成功：已保存到所选文件夹');
      return;
    } catch (err) {
      if (err.name === 'AbortError') return;
      console.warn('文件夹选择失败，降级为多文件下载', err);
    }
  }
  
  toast('正在逐个下载备份文件，请允许浏览器多文件下载...');
  for (const t of S.tables) {
    const wb = buildTableExcel(t, false);
    const fileName = t.name.replace(/[\\\/\?\*\[\]\:]/g, '_') + '.xlsx';
    XLSX.writeFile(wb, fileName);
    await new Promise(r => setTimeout(r, 300));
  }
}

function compressImage(file, maxW, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => { let w = img.width, h = img.height; if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; } const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h; canvas.getContext('2d').drawImage(img, 0, 0, w, h); try { resolve(canvas.toDataURL('image/jpeg', quality)); } catch (e) { reject(e); } };
      img.onerror = () => reject(new Error('图片加载失败')); img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('图片读取失败')); reader.readAsDataURL(file);
  });
}

  document.getElementById('redoBtn').onclick = redo;

  document.getElementById('importExcelBtn').onclick = () => { pendingImportTable = currentTable().id; const inp = document.getElementById('importExcelInput'); inp.value = ''; inp.click(); };
  document.getElementById('exportExcelBtn').onclick = () => exportExcel(currentTable());
  document.getElementById('tplExcelBtn').onclick = () => downloadExcelTemplate(currentTable());
  document.getElementById('tblSettingsBtn').onclick = () => openTableSettings(currentTable());

  document.getElementById('attImportInput').addEventListener('change', async e => {
    const files = e.target.files;
    e.target.value = '';
    if (!files || files.length === 0) return;
    if (!attachmentDirHandle) { toast('请先设置附件仓库', 'error'); return; }
    
    try {
      let perm = await attachmentDirHandle.queryPermission({ mode: 'readwrite' });
      if (perm !== 'granted') {
        perm = await attachmentDirHandle.requestPermission({ mode: 'readwrite' });
        if (perm !== 'granted') { toast('无文件写入权限', 'error'); return; }
      }
      
      let successCount = 0;
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        let fName = file.name;
        let finalName = fName;
        let idx = 1;
        while (true) {
          try {
            await attachmentDirHandle.getFileHandle(finalName);
            const extIdx = fName.lastIndexOf('.');
            const base = extIdx > -1 ? fName.slice(0, extIdx) : fName;
            const ext = extIdx > -1 ? fName.slice(extIdx) : '';
            finalName = `${base}_${idx}${ext}`;
            idx++;
          } catch (err) { break; }
        }

        const newHandle = await attachmentDirHandle.getFileHandle(finalName, { create: true });
        const writable = await newHandle.createWritable();
        await writable.write(file);
        await writable.close();
        successCount++;
      }
      
      toast(`成功导入 ${successCount} 个文件`);
      loadAttachments();
    } catch (err) {
      console.error(err);
      toast('导入文件失败', 'error');
    }
  });

  document.getElementById('sidebar').addEventListener('click', e => { 
    if (ui.currentView === 'attachments') {
      const item = e.target.closest('[data-att-cat]');
      if (item) {
        ui.attCategory = item.dataset.attCat;
        ui.attSelectedFiles.clear();
        renderAttachmentsSidebar();
        renderAttachmentsView();
        return;
      }
      if (e.target.closest('[data-manage-att-cat]')) openManageAttCategories();
    } else {
      const item = e.target.closest('[data-cat]'); 
      if (item) { 
        const t = currentTable();
        if (!uiState.categoryId) uiState.categoryId = {};
        uiState.categoryId[t.id] = item.dataset.cat; 
        saveUiState();
        ui.page = 1; 
        renderSidebar(); 
        renderTable(); 
        return; 
      } 
      if (e.target.closest('[data-managecat]')) openCategoryManager(); 
    }
  });
  
  const tb = document.getElementById('toolbar');
  tb.addEventListener('input', e => { 
    if (e.target.id === 'searchInput') { 
      const t = currentTable();
      uiState.search[t.id] = e.target.value; 
      saveUiState();
      ui.page = 1; 
      renderTable(); 
    } 
  });
  tb.addEventListener('click', e => {
    const t = currentTable();
    const id = e.target.id;
    if (id === 'resetFilter') { 
      uiState.search[t.id] = ''; 
      uiState.categoryId = uiState.categoryId || {};
      uiState.categoryId[t.id] = ''; 
      uiState.filters[t.id] = [];
      saveUiState();
      ui.page = 1; 
      renderSidebar();
      renderToolbar(); 
      renderTable(); 
    }
    else if (id === 'addFilterBtn') { openFilterPopover(e.target); }
    else if (id === 'undoBtn') { undo(); }
    else if (id === 'redoBtn') { redo(); }
    else if (id === 'addRecord') { openRecordForm(t); }
    else if (id === 'batchDelBtn') { batchDeleteRecords(t); }
    
    const delFilterBtn = e.target.closest('[data-del-filter]');
    if (delFilterBtn) {
      const idx = Number(delFilterBtn.dataset.delFilter);
      uiState.filters[t.id].splice(idx, 1);
      saveUiState();
      renderToolbar();
      renderTable();
    }
  });

  document.getElementById('tableWrap').addEventListener('click', async e => {
    if (e.target.id === 'selectAllCb') {
      const allFiltered = filteredRecords(currentTable());
      const start = (ui.page - 1) * ui.pageSize;
      const recs = allFiltered.slice(start, start + ui.pageSize);
      if (e.target.checked) recs.forEach(r => ui.selectedIds.add(r.id));
      else recs.forEach(r => ui.selectedIds.delete(r.id));
      renderTable(); renderToolbar();
      return;
    }
    if (e.target.classList.contains('row-cb')) {
      const id = e.target.dataset.id;
      if (e.target.checked) ui.selectedIds.add(id);
      else ui.selectedIds.delete(id);
      e.target.closest('tr').classList.toggle('selected', e.target.checked);
      renderToolbar();
      return;
    }

    const thumb = e.target.closest('.thumb');
    if (thumb) { openModal({ title: '查看图片', width: '640px', body: `<div style="text-align:center"><img src="${thumb.src}" style="max-width:100%;max-height:70vh;border-radius:8px"></div>`, footer: `<button class="btn" data-cancel>关闭</button>`, onMount(el, closeFn) { el.querySelector('[data-cancel]').onclick = closeFn; } }); return; }
    if (e.target.closest('[data-empty-add]')) { openRecordForm(currentTable()); return; }
    
    const fileLink = e.target.closest('.file-link');
    if (fileLink) {
      previewAttachment(fileLink.dataset.file);
      return;
    }

    const btn = e.target.closest('button[data-act]'); if (!btn) return;
    const t = currentTable(); if (!t) return; const rec = t.records.find(r => r.id === btn.dataset.id); if (!rec) return;
    if (btn.dataset.act === 'edit') openRecordForm(t, rec);
    else if (btn.dataset.act === 'del') await deleteRecord(t, rec);
    else if (btn.dataset.act === 'flow') flowRecord(t, rec, btn.dataset.to);
  });

  document.getElementById('settingsBtn').onclick = openSettings;
  document.getElementById('manualBackupBtn').onclick = backupAll;
  document.getElementById('manualRestoreBtn').onclick = () => { const inp = document.getElementById('restoreInput'); inp.value = ''; inp.click(); };
  
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
      if (e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
      else if (e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
    }
  });

  document.getElementById('restoreInput').addEventListener('change', async e => {
    const files = e.target.files;
    e.target.value = '';
    if (!files || files.length === 0) return;
    const ok = await confirmDialog({ title: '恢复数据', message: '恢复将<b>覆盖</b>对应表的数据，确定继续吗？', danger: true, okText: '覆盖恢复' }); 
    if (!ok) return;
    pushUndo();
    await processFiles(files, true);
  });
  
  document.getElementById('importExcelInput').addEventListener('change', async e => {
    const files = e.target.files;
    e.target.value = '';
    if (!files || files.length === 0) return;
    pushUndo();
    await processFiles(files, false, pendingImportTable);
    pendingImportTable = null;
  });

  document.getElementById('bgImageInput').addEventListener('change', async e => { 
    const f = e.target.files[0]; e.target.value = ''; if (!f) return; 
    try { 
      const dataUrl = await compressImage(f, 600, 0.55); 
      S.settings.bgImage = dataUrl; S.settings.bgType = 'local'; 
      save(); applyBg(); toast('背景已更新'); 
      const span = document.querySelector('#localRow span'); if(span) span.textContent = '已设置本地图片';
    } catch (err) { toast('图片处理失败', 'error'); } 
  });
}

async function init(){
  // 由于读取 IndexedDB 是异步的，这里整个 init 变为 async
  S = await loadState();
  loadUiState();

  const lastId = localStorage.getItem('dfy_last_table');
  if (lastId && S.tables.find(t => t.id === lastId)) ui.tableId = lastId;
  else ui.tableId = S.tables[0] ? S.tables[0].id : null;

  applyTheme(); applyBg(); renderView(); bindEvents();
  checkPermissionStatus();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
